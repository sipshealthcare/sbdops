<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBD Platform &middot; Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D49A00;--ink:#070d1f;--card:#0e1328;--line:#1c2646;--lift:#131b3a;
--txt:#e6ebf5;--dim:#94a3b8;--mut:#64748b;--red:#f0616d;--amb:#e0a132;--grn:#3fb984}

/* ── SIMVOLY / BAKND EMBED COLOR LOCK ─────────────────────────── */
@layer host-reset{ #sbd-root, #sbd-root *{ box-sizing:border-box !important; } }
#sbd-root, #sbd-root div,#sbd-root span,#sbd-root p,#sbd-root a,#sbd-root li,
#sbd-root h1,#sbd-root h2,#sbd-root h3,#sbd-root button{font-family:'Poppins',-apple-system,'Segoe UI',sans-serif !important;}
#sbd-root{background:#070d1f !important;color:#e6ebf5 !important;}
#sbd-root .bmark{background:#D49A00 !important;color:#000000 !important;}
#sbd-root .hero-t,#sbd-root .card-t,#sbd-root .it-t{color:#ffffff !important;}
#sbd-root .hero-s,#sbd-root .card-s,#sbd-root .stat-l{color:#94a3b8 !important;}
#sbd-root .hero-d,#sbd-root .it-m,#sbd-root .foot{color:#64748b !important;}
#sbd-root .card,#sbd-root .stat{background:#0e1328 !important;border-color:#1c2646 !important;}
#sbd-root .it{background:#131b3a !important;border-color:#1c2646 !important;}
#sbd-root .stat-v{color:#ffffff !important;}
#sbd-root .btn{background:#1c2646 !important;color:#e6ebf5 !important;}
#sbd-root .pill{color:#e6ebf5 !important;}
#sbd-root .p-grn{background:rgba(63,185,132,.14) !important;color:#3fb984 !important;}
#sbd-root .p-amb{background:rgba(224,161,50,.14) !important;color:#e0a132 !important;}
#sbd-root .p-gry{background:rgba(100,116,139,.18) !important;color:#94a3b8 !important;}
#sbd-root .p-red{background:rgba(240,97,109,.14) !important;color:#f0616d !important;}
#sbd-root .ic{background:#131b3a !important;color:#94a3b8 !important;}
#sbd-root .ic.warm{background:linear-gradient(140deg,#D49A00,#8a6400) !important;color:#000000 !important;}
#sbd-root .proof{color:#cbd5e5 !important;border-color:#3fb984 !important;}
#sbd-root .proof-l{color:#3fb984 !important;}
#sbd-root .when{color:#e6ebf5 !important;border-left-color:#D49A00 !important;}
#sbd-root .when-l{color:#D49A00 !important;} #sbd-root .when-n{color:#94a3b8 !important;}
#sbd-root .when.done{border-left-color:#3fb984 !important;}
#sbd-root .when.done .when-l{color:#3fb984 !important;}
#sbd-root .when.soft{border-left-color:#1c2646 !important;color:#94a3b8 !important;}
#sbd-root .when.soft .when-l{color:#64748b !important;}
#sbd-root .when.late{border-left-color:#f0616d !important;}
#sbd-root .when.late .when-l{color:#f0616d !important;}
#sbd-root .srch{background:#0e1328 !important;color:#e6ebf5 !important;border-color:#1c2646 !important;}
#sbd-root .srch::placeholder{color:#64748b !important;}
#sbd-root .lside{background:#0a1024 !important;border-color:#1c2646 !important;}
#sbd-root .lnav .ni{color:#94a3b8 !important;background:transparent !important;}
#sbd-root .lnav .ni:hover{color:#e6ebf5 !important;background:#131b3a !important;}
#sbd-root .lnav .ni.on{background:linear-gradient(120deg,rgba(212,154,0,.92),rgba(212,154,0,.55)) !important;color:#000000 !important;}
#sbd-root .lnav .nn{background:#1c2646 !important;color:#e6ebf5 !important;}
#sbd-root .lnav .ni.on .nn{background:rgba(0,0,0,.22) !important;color:#000000 !important;}
#sbd-root .top-t{color:#ffffff !important;}
/* ── END LOCK ──────────────────────────────────────────────────── */

*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  position:relative;overflow-x:hidden}
#sbd-root:before{content:'';position:fixed;top:-220px;right:-180px;width:720px;height:600px;
  background:radial-gradient(closest-side,rgba(212,154,0,.26),rgba(212,154,0,.08) 55%,transparent 78%);
  filter:blur(18px);pointer-events:none;z-index:0}
.main{position:relative;z-index:1;max-width:840px;margin:0 auto;padding:26px 18px 70px}

.top{display:flex;align-items:center;gap:11px;padding-bottom:22px}
.bmark{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:11.5px;flex:0 0 34px}
.bname{font-weight:600;font-size:15px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.btn{border:0;border-radius:10px;padding:10px 17px;font-size:13px;font-weight:600;
  cursor:pointer;font-family:inherit;margin-left:auto;min-height:40px}
.btn:hover{background:#243056!important}

.hero{padding:2px 0 22px}
.hero-d{font-size:12px}
.hero-t{font-size:29px;font-weight:600;line-height:1.14;margin-top:6px;letter-spacing:-.02em;text-wrap:balance}
.hero-s{font-size:15px;margin-top:6px;max-width:60ch}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:20px}
.stat{border:1px solid var(--line);border-radius:15px;padding:16px}
.stat-v{font-size:27px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat-l{font-size:11px;letter-spacing:.03em;margin-top:7px}

.card{border:1px solid var(--line);border-radius:17px;padding:19px;margin-bottom:15px}
.card-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:15px}
.ic{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;font-size:14px}
.card-t{font-size:16px;font-weight:600}
.card-s{font-size:12.5px;margin-top:2px}

.it{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;
  break-inside:avoid}
.it:last-child{margin-bottom:0}
@media(min-width:1250px){
  .itgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .itgrid .it{margin-bottom:0}
}
@media(min-width:1750px){ .itgrid{grid-template-columns:repeat(3,1fr)} }
.it-h{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}
.it-t{font-size:13.5px;font-weight:600;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.it-m{font-size:11px;margin-top:6px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.proof{margin-top:9px;font-size:11.5px;line-height:1.5;border-left:2px solid var(--grn);padding:3px 0 3px 9px}
.proof-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;margin-bottom:2px}
.empty{font-size:13px;color:var(--dim)}
.foot{font-size:11.5px;text-align:center;padding-top:24px;line-height:1.6}
@media(max-width:640px){
  .stats{grid-template-columns:1fr}
  .hero-t{font-size:23px}
  .main{padding:20px 14px 60px}
}

.when{margin-top:9px;font-size:12.5px;line-height:1.5;color:#e6ebf5;
  border-left:2px solid var(--gold);padding:3px 0 3px 10px}
.when-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gold);font-weight:600;margin-bottom:2px}
.when-n{color:var(--dim);font-size:11.5px}
.when.done{border-left-color:var(--grn)} .when.done .when-l{color:var(--grn)}
.when.soft{border-left-color:var(--line);color:var(--dim)}
.when.soft .when-l{color:var(--mut)}
.when.late{border-left-color:var(--red)} .when.late .when-l{color:var(--red)}
/* the sentence a leader can repeat without reading the list */
.lede{font-size:16px;line-height:1.6;color:#e6ebf5;margin:-4px 0 20px;max-width:78ch}
.lede b{color:var(--gold);font-weight:700}
.stamp{font-size:11px;color:var(--mut);margin-left:auto;text-align:right;line-height:1.45}
.stamp b{display:block;color:var(--dim);font-weight:600}
.grp{display:flex;align-items:center;gap:11px;margin:20px 0 11px;
  font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:600}
.grp:first-of-type{margin-top:4px}
.grp:after{content:'';flex:1;height:1px;background:var(--line)}
.it-ref{font-size:11px;color:var(--mut);margin-top:5px}
.it-ref .hash{font-weight:700;color:var(--dim)}
.note{border:1px solid var(--line);border-radius:14px;padding:15px 16px;margin-top:18px;
  background:rgba(63,185,132,.045)}
.note-t{font-size:12.5px;font-weight:600;color:var(--grn);margin-bottom:6px}
.note-b{font-size:12.5px;line-height:1.65;color:var(--dim);max-width:74ch}
/* At a glance. Circles carry the shape, the key carries the numbers, and both
   are clickable so a glance can become a list. */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.dash3{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:15px}
@media(max-width:1250px){.dash3{grid-template-columns:1fr 1fr}}
@media(max-width:820px){.dash,.dash3{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}
@media(max-width:820px){.kpis{grid-template-columns:1fr 1fr}}
@media(min-width:1500px){.kpis{grid-template-columns:repeat(4,1fr)}
  .dash{grid-template-columns:repeat(4,1fr)}}
.kpi{border:1px solid var(--line);border-radius:15px;padding:15px;background:var(--card);
  text-align:left;font-family:inherit;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--gold)}
.kpi-v{font-size:27px;font-weight:700;line-height:1;color:#fff}
.kpi-v.grn{color:var(--grn)} .kpi-v.amb{color:var(--amb)} .kpi-v.red{color:var(--red)}
.kpi-l{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.4}
.cwrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.dnt{width:140px;height:140px;flex:0 0 140px}
.dseg{cursor:pointer;transition:opacity .15s}
.dseg:hover{opacity:.72}
.dnt-v{font-size:26px;font-weight:700;fill:#fff;text-anchor:middle;font-family:inherit}
.dnt-l{font-size:10px;fill:var(--mut);text-anchor:middle;letter-spacing:.06em;
  text-transform:uppercase;font-family:inherit}
.dkey{flex:1;min-width:160px;display:flex;flex-direction:column;gap:2px}
.dk{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.5px;color:var(--dim);
  border:0;background:none;font-family:inherit;text-align:left;cursor:pointer;width:100%}
.dk:hover{color:var(--txt)}
.dk .sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px}
.dk .kv{margin-left:auto;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
/* a single number with its trend, which is what pace actually is */
.pace{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.pace-n{font-size:46px;font-weight:700;line-height:.95;color:#fff}
.pace-c{font-size:12.5px;color:var(--dim);line-height:1.55;max-width:34ch}
.pace-c b{color:var(--grn)}
.pace-c b.down{color:var(--amb)}
.wk8{display:flex;align-items:flex-end;gap:7px;margin-top:18px}
.wk8 .c{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.wk8 .cv{font-size:11px;font-weight:700;color:#e6ebf5;text-align:center;height:16px;
  font-variant-numeric:tabular-nums}
.wk8 .cb{background:var(--grn);border-radius:4px 4px 0 0;min-height:2px;opacity:.5}
.wk8 .c.on .cb{opacity:1}
.wk8 .cl{font-size:10px;color:var(--mut);text-align:center;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--line);white-space:nowrap}
.mini{display:flex;justify-content:space-between;gap:10px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-child{border-bottom:0}
.mini-t{color:#cbd5e5;min-width:0;overflow-wrap:anywhere}
.mini-d{color:var(--mut);font-size:11px;white-space:nowrap}
/* Raising an update. Same shape as the report form staff already use. */
.f{margin-bottom:17px}
.f-l{display:block;font-size:13px;font-weight:600;color:#fff;margin-bottom:3px}
.f-h{display:block;font-size:11.5px;color:var(--mut);margin-bottom:8px;line-height:1.5}
.inp,.sel,.ta{width:100%;background:var(--card);border:1px solid var(--line);border-radius:11px;
  color:var(--txt);padding:12px 14px;font-size:13.5px;font-family:inherit;line-height:1.5}
.inp::placeholder,.ta::placeholder{color:var(--mut)}
.inp:focus,.sel:focus,.ta:focus{outline:2px solid var(--gold);outline-offset:-1px}
.ta{min-height:118px;resize:vertical}
.sel{cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:38px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--dim);border-radius:10px;
  padding:9px 14px;font-size:12.5px;font-family:inherit;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--gold);color:var(--txt)}
.chip.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.send{border:0;border-radius:11px;padding:12px 22px;font-size:13.5px;font-weight:600;
  background:var(--gold);color:#000;cursor:pointer;font-family:inherit}
.send:disabled{opacity:.55;cursor:default}
.upd{border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;background:var(--lift)}
.upd:last-child{margin-bottom:0}
.upd-h{display:flex;justify-content:space-between;gap:11px;align-items:flex-start}
.upd-t{font-size:13px;line-height:1.55;color:#e6ebf5;min-width:0;overflow-wrap:anywhere}
.upd-m{font-size:11px;color:var(--mut);margin-top:7px}
.upd-m .hash{color:var(--gold);font-weight:700}
.upd-s{margin-top:9px;font-size:12px;line-height:1.55;border-left:2px solid var(--line);
  padding:3px 0 3px 10px;color:var(--dim)}
.upd-s.go{border-left-color:var(--grn);color:#cbd5e5}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--gold);
  color:#000;padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:70;
  opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.srchwrap{margin:-6px 0 18px}
.srch{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--txt);padding:12px 15px;font-size:13.5px;font-family:inherit}
.srch::placeholder{color:var(--mut)}
.srch:focus{outline:2px solid var(--gold);outline-offset:-1px}

.wrap{display:flex;min-height:100vh;position:relative;z-index:1}
.lside{width:212px;flex:0 0 212px;border-right:1px solid var(--line);background:#0a1024;
  position:sticky;top:0;height:100vh;padding:20px 12px}
.lbrand{display:flex;align-items:center;gap:10px;padding:0 4px 18px}
.lnav{display:flex;flex-direction:column;gap:4px}
.lnav .ni{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;
  border-radius:11px;font-size:13.5px;cursor:pointer;text-align:left;font-family:inherit;
  background:none;color:var(--dim);font-weight:500}
.lnav .ni:hover{background:var(--lift);color:var(--txt)}
.lnav .ni.on{background:linear-gradient(120deg,rgba(212,154,0,.92),rgba(212,154,0,.55));
  color:#000;font-weight:600}
.lnav .nn{margin-left:auto;font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;
  min-width:22px;text-align:center;background:var(--line);color:var(--txt)}
.lnav .ni.on .nn{background:rgba(0,0,0,.22);color:#000}
.top-t{font-size:20px;font-weight:600;color:#fff}
.main{flex:1;min-width:0;max-width:none;margin:0;padding:24px 28px 70px}
@media(min-width:1600px){.main{max-width:1560px}}
@media(max-width:820px){
  .wrap{display:block}
  .lside{position:static;width:auto;height:auto;display:flex;align-items:center;gap:12px;
    padding:14px;border-right:0;border-bottom:1px solid var(--line)}
  .lbrand{padding:0}
  .lnav{flex-direction:row;flex:1;justify-content:flex-end}
  .lnav .ni{width:auto;padding:9px 13px}
  .main{padding:18px 14px 60px}
}

/* Speak instead of typing. One floating button follows whichever field has focus,
   so no layout on any page has to make room for it. */
.micb{position:fixed;z-index:60;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line);background:var(--lift);color:var(--dim);
  display:none;place-items:center;cursor:pointer;padding:0;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.micb.on2{display:grid}
.micb:hover{color:var(--gold);border-color:var(--gold)}
.micb.rec{color:#000;background:var(--gold);border-color:var(--gold);
  animation:micp 1.25s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(212,154,0,.55)}
  50%{box-shadow:0 0 0 7px rgba(212,154,0,0)}}
@media(prefers-reduced-motion:reduce){.micb.rec{animation:none}}
.michint{position:fixed;z-index:60;font-size:10.5px;font-weight:600;color:#000;
  background:var(--gold);border-radius:7px;padding:3px 8px;display:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.michint.on2{display:block}
</style>
</head>
<body>
<div id="sbd-root">
  <div class="wrap">
    <aside class="lside">
      <div class="lbrand"><div class="bmark">SBD</div>
        <div><div class="bname">SBD Platform</div><div class="bsub">Delivery</div></div></div>
      <nav class="lnav" id="lnav"></nav>
    </aside>
    <div class="main">
      <div class="top">
        <div class="top-t" id="ttl">Live</div>
        <div class="stamp" id="stamp"></div>
        <button class="btn" id="refresh" style="margin-left:14px">Refresh</button>
      </div>
      <div class="srchwrap"><input class="srch" id="search"
        placeholder="Search &mdash; a number, or words from a task"></div>
      <div id="view"><div class="empty">Loading…</div></div>
      <div class="toast" id="toast"></div>
    </div>
  </div>
</div>

<script>
/* Read-only leadership view of the SBD Platform build.
   It reads one curated database view, v_public_tracker, which contains only
   the items Ignacio has marked for sharing and only the columns safe to share.
   Internal notes, intake, the question thread and any date still being agreed
   never reach this page. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

const esc=t=>String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const D=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const DL=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);

let ROWS=[];
async function load(){
  const r=await fetch(`${SB_URL}/rest/v1/v_public_tracker?select=*`,
    {cache:'no-store',headers:{apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`}});
  if(!r.ok) throw new Error('Could not reach the record just now.');
  ROWS=await r.json();
}

const label=s=>({shipped:'Live','in-progress':'In progress',blocked:'Blocked',
                 backlog:'Scheduled',open:'In hand'}[s]||s);
const tone =s=>({shipped:'p-grn','in-progress':'p-amb',blocked:'p-red'}[s]||'p-gry');

/* Expected completion is only ever a date both sides agreed. Where one is
   still being settled we say so rather than publishing a number that may move,
   and rather than showing nothing, which reads as unplanned. */
function whenBlock(t){
  if(t.status==='shipped')
    return `<div class="when done"><span class="when-l">Completed</span>${D(t.shipped_on)}</div>`;
  if(t.date_status==='agreed'&&t.due_on){
    const n=days(t.due_on);
    const note=n<0?`${Math.abs(n)} day${Math.abs(n)===1?'':'s'} past this date`
             :n===0?'today':n===1?'tomorrow':`in ${n} days`;
    return `<div class="when${n<0?' late':''}"><span class="when-l">Expected completion</span>
      ${DL(t.due_on)} <span class="when-n">&middot; ${note}</span></div>`;
  }
  if(t.date_status==='being agreed')
    return `<div class="when soft"><span class="when-l">Expected completion</span>
      Being agreed with the development team</div>`;
  if(t.date_status==='not scheduled')
    return `<div class="when soft"><span class="when-l">Expected completion</span>Not scheduled yet</div>`;
  return `<div class="when soft"><span class="when-l">Expected completion</span>Not set yet</div>`;
}

/* Lead with the plain-English line where one has been written, and keep the build
   title underneath so the two records can always be tied together. */
function item(t){

  return `<div class="it">
    <div class="it-h"><div class="it-t">${esc(head)}</div>
      <div>${P(tone(t.status),label(t.status))}</div></div>

    ${whenBlock(t)}
    ${t.confirmed_by?`<div class="proof"><span class="proof-l">How it was confirmed</span>${esc(t.confirmed_by)}</div>`:''}
  </div>`;
}

/* Month buckets. A leader thinks in when, not in item number. */
function monthKey(d){ const x=new Date(d+'T12:00:00'); return x.getFullYear()*12+x.getMonth(); }
function monthGroups(rows){
  const n=new Date(today()+'T12:00:00'), cur=n.getFullYear()*12+n.getMonth();
  const name=k=>new Date(Math.floor(k/12), k%12, 1).toLocaleDateString('en-US',{month:'long'});
  const out=new Map();
  rows.forEach(t=>{
    if(!t.due_on){ push('Date being agreed', t); return; }
    const k=monthKey(t.due_on);
    push(k===cur?`This month, ${name(k)}`:k===cur+1?`Next month, ${name(k)}`:`Later, from ${name(k)}`, t);
  });
  function push(label,t){ if(!out.has(label)) out.set(label,[]); out.get(label).push(t); }
  return [...out.entries()];
}

const HOWNOTE=`<div class="note">
  <div class="note-t">How to read this record</div>
  <div class="note-b">Nothing appears here without a completion date both sides have agreed, so a date
  on this page is a commitment rather than an estimate. If a date is being renegotiated the item comes
  off the page until it is agreed again. Where an item was checked against the running system before it
  was marked live, that check is written underneath it in its own words.</div>
</div>`;

/* One ring per question. Segments and key rows both carry a target tab, so a
   glance turns into the matching list in one click. */
function donut(segs){
  const total=segs.reduce((a,x)=>a+x.n,0)||1;
  const R=54, C=2*Math.PI*R, GAP=3.5;
  let off=0, arcs='';
  segs.forEach(x=>{
    if(x.n){
      const len=Math.max(1, x.n/total*C-GAP);
      arcs+=`<circle class="dseg" data-t="${x.go}" r="${R}" cx="70" cy="70" fill="none"
        stroke="${x.c}" stroke-width="15"
        stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}"
        stroke-dashoffset="${(-off).toFixed(2)}"><title>${esc(x.l)}: ${x.n}</title></circle>`;
      off+=x.n/total*C;
    }
  });
  return `<svg viewBox="0 0 140 140" class="dnt" role="img" aria-label="Delivery status">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="#1c2646" stroke-width="15"></circle>
    <g transform="rotate(-90 70 70)">${arcs}</g>
    <text x="70" y="68" class="dnt-v">${segs.reduce((a,x)=>a+x.n,0)}</text>
    <text x="70" y="86" class="dnt-l">shared</text></svg>
  <div class="dkey">${segs.map(x=>
    `<button class="dk" data-t="${x.go}"><i class="sw" style="background:${x.c}"></i>${esc(x.l)}<span class="kv">${x.n}</span></button>`).join('')}</div>`;
}

/* Delivered per week, eight weeks back, from the dates on the record itself. */
function shippedWeeks(rows){
  const mon=d=>{const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;};
  const start=mon(today()), out=[];
  for(let i=7;i>=0;i--){
    const a=new Date(start); a.setDate(a.getDate()-i*7);
    const b=new Date(a); b.setDate(b.getDate()+7);
    const ai=a.toISOString().slice(0,10), bi=b.toISOString().slice(0,10);
    out.push({label:D(ai), n:rows.filter(t=>t.shipped_on&&t.shipped_on>=ai&&t.shipped_on<bi).length});
  }
  return out;
}

function monthStart(){ const d=new Date(today()+'T12:00:00'); d.setDate(1); return d.toISOString().slice(0,10); }
function monthEnd(){ const d=new Date(today()+'T12:00:00'); d.setMonth(d.getMonth()+1,0); return d.toISOString().slice(0,10); }
function monthName(){ return new Date(today()+'T12:00:00').toLocaleDateString('en-US',{month:'long'}); }

function ring(done,total,label,sub){
  const R=54, C=2*Math.PI*R, pct=total?done/total:0;
  return `<svg viewBox="0 0 140 140" class="dnt" role="img" aria-label="${esc(label)}">
    <circle r="${R}" cx="70" cy="70" fill="none" stroke="#1c2646" stroke-width="15"></circle>
    <g transform="rotate(-90 70 70)"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--grn)"
      stroke-width="15" stroke-linecap="round"
      stroke-dasharray="${(pct*C).toFixed(2)} ${C.toFixed(2)}"></circle></g>
    <text x="70" y="68" class="dnt-v">${Math.round(pct*100)}%</text>
    <text x="70" y="86" class="dnt-l">done</text></svg>
  <div class="dkey"><div class="dk" style="cursor:default">${esc(label)}<span class="kv">${done} of ${total}</span></div>
    <div style="font-size:11.5px;color:var(--mut);line-height:1.55;padding-top:4px">${esc(sub)}</div></div>`;
}

function updState(u){
  if(u.item_number){
    const d=u.item_date?DL(u.item_date):null;
    if(u.item_status==='shipped') return {t:`Live. Delivered ${d||'and recorded'}.`,go:true};
    if(u.item_date_state==='confirmed'&&d) return {t:`Scheduled for ${d}, agreed with the development team.`,go:true};
    if(u.item_date_state==='pending'&&d)   return {t:`Date of ${d} proposed, waiting on the development team to confirm.`,go:false};
    if(u.item_date_state==='countered'&&d) return {t:`The development team sent back ${d}. Dr. Jake is settling it.`,go:false};
    return {t:'On the tracker as #'+u.item_number+'. No date agreed yet.',go:false};
  }
  if(u.status==='tabled') return {t:'Parked for now.'+(u.decision?' '+u.decision:''),go:false};
  if(u.status==='closed') return {t:'Closed.'+(u.decision?' '+u.decision:''),go:false};
  if(u.status==='approved') return {t:'Approved. It is being scheduled.',go:true};
  return {t:'With Dr. Jake. He reads these himself.',go:false};
}

document.addEventListener('click',async e=>{
  const im=e.target.closest('[data-imp]');
  if(im){ uImpact=im.dataset.imp; uArea=(document.getElementById('uarea')||{}).value||uArea;
    const w=document.getElementById('uwho'); if(w) localStorage.setItem(WHOKEY,w.value.trim());
    draw(); return; }

  if(e.target.id==='usend'){
    const who=(document.getElementById('uwho')||{}).value.trim();
    const what=(document.getElementById('uwhat')||{}).value.trim();
    const area=(document.getElementById('uarea')||{}).value;
    if(!who)  return say('Put your name on it.');
    if(!area) return say('Pick the part of the platform it relates to.');
    if(what.length<10) return say('Say a little more about what is needed.');
    e.target.disabled=true; e.target.textContent='Sending…';
    try{
      const r=await fetch(`${SB_URL}/rest/v1/rpc/submit_update`,{method:'POST',
        headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:`Bearer ${SB_KEY}`},
        body:JSON.stringify({p_who:who,p_what:what,p_area:area,p_impact:uImpact})});
      const d=await r.json();
      if(!r.ok) throw new Error(d&&(d.message||d.hint)||'It did not send. Try again in a moment.');
      localStorage.setItem(WHOKEY,who);
      uArea=''; uImpact='Just an idea';
      const box=document.getElementById('uwhat'); if(box) box.value='';
      await loadMine(); draw();
      say(`Sent as ${d}. It is with Dr. Jake.`);
      window.scrollTo(0,0);
    }catch(err){ say(err.message); }
    finally{ const b=document.getElementById('usend');
      if(b){ b.disabled=false; b.textContent='Send it to Dr. Jake'; } }
    return;
  }

  const t=e.target.closest('[data-t]'); if(!t) return;
  LTAB=t.dataset.t;
  if(LTAB==='upd'){ await loadAreas(); await loadMine(); }
  draw(); window.scrollTo(0,0);
});

  b.disabled=true; if(!quiet) b.textContent='Refreshing…';
  try{ await load(); draw(); }
  catch(e){ document.getElementById('view').innerHTML=
    `<div class="card"><div class="card-t">Could not load</div>
     <div class="card-s" style="margin-top:7px">${esc(e.message)} Try Refresh in a moment.</div></div>`; }
  finally{ b.disabled=false; b.textContent='Refresh'; }
}
document.getElementById('refresh').onclick=()=>go();
go(true);

/* Speech to text on every text field.
   One button lives at the document level and moves to whichever field has focus.
   Nothing about any form changes, and browsers without the API never see it. */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  function ok(el){
    if(!el) return false;
    if(el.tagName === 'TEXTAREA') return true;
    if(el.tagName !== 'INPUT') return false;
    var t = (el.getAttribute('type') || 'text').toLowerCase();
    return t === 'text' || t === 'search';
  }
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'micb';
  b.setAttribute('aria-label', 'Speak instead of typing');
  b.title = 'Speak instead of typing';
  b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">' +
    '<path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>' +
    '<path fill="currentColor" d="M18 12a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A6 6 0 0 0 18 12z"/>' +
    '</svg>';
  var hint = document.createElement('div');
  hint.className = 'michint'; hint.textContent = 'Listening';
  document.body.appendChild(b); document.body.appendChild(hint);

  var field = null, rec = null, live = false, base = '', at = 0;

  function place(){
    if(!field || !document.body.contains(field)){ hide(); return; }
    var r = field.getBoundingClientRect();
    if(r.width < 90 || r.bottom < 4 || r.top > innerHeight - 4){ hide(); return; }
    var top = field.tagName === 'TEXTAREA' ? r.top + 8 : r.top + (r.height - 26) / 2;
    b.style.left = (r.right - 33) + 'px'; b.style.top = top + 'px';
    b.classList.add('on2');
    hint.style.left = (r.right - 33) + 'px'; hint.style.top = (top - 24) + 'px';
    if(live) hint.classList.add('on2'); else hint.classList.remove('on2');
  }
  function hide(){ b.classList.remove('on2'); hint.classList.remove('on2'); }

  addEventListener('focusin', function(e){ if(ok(e.target)){ field = e.target; place(); } });
  addEventListener('focusout', function(e){
    if(e.target !== field) return;
    setTimeout(function(){
      if(document.activeElement !== field && !live){ hide(); field = null; }
    }, 150);
  });
  addEventListener('scroll', place, true);
  addEventListener('resize', place);

  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){
    if(live){ try{ rec.stop(); }catch(_){} return; }
    if(!field) return;
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    base = field.value;
    at = (typeof field.selectionStart === 'number') ? field.selectionStart : field.value.length;
    rec.onstart = function(){ live = true; b.classList.add('rec'); place(); };
    rec.onerror = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2'); };
    rec.onend   = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2');
                              if(field) try{ field.focus(); }catch(_){} };
    rec.onresult = function(ev){
      var txt = '';
      for(var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      txt = txt.replace(/\s+/g, ' ').trim();
      if(!txt) return;
      var pre = base.slice(0, at), post = base.slice(at);
      var sep = (pre && !/\s$/.test(pre)) ? ' ' : '';
      field.value = pre + sep + txt + post;
      try{ field.setSelectionRange(field.value.length - post.length, field.value.length - post.length); }catch(_){}
      field.dispatchEvent(new Event('input', {bubbles:true}));
      place();
    };
    try{ rec.start(); }catch(_){}
  });
})();
</script>
</body>
