*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}

.side{width:222px;flex:0 0 222px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s}
.side.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.bmark{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 30px}
.bname{font-weight:600;font-size:14px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.report{display:block;width:calc(100% - 20px);margin:0 10px 12px;border:0;border-radius:9px;padding:11px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit}
.nav{padding:2px 10px 16px;overflow-y:auto;flex:1}
.nav-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;padding:10px 8px 6px}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 11px;border:0;border-radius:8px;font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-n{font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;min-width:21px;text-align:center}

.main{flex:1;min-width:0;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 18px}
.burger{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;display:grid;place-content:center;gap:4px;cursor:pointer;flex:0 0 36px}
.burger span{width:15px;height:2px;border-radius:2px;display:block}
.top-t{font-size:20px;font-weight:600;line-height:1.2}
.top-s{font-size:12.5px;margin-top:1px}
.view{display:none}
.view.on{display:block}
.max{max-width:760px}

.card{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:13px}
.card-h{margin-bottom:14px}
.card-t{font-size:15.5px;font-weight:600}
.card-s{font-size:12.5px;margin-top:2px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:13px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;font-family:inherit;transition:border-color .15s}
.stat-v{font-size:23px;font-weight:700;line-height:1.1}
.stat-l{font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-top:5px}
.stat-d{font-size:11px;margin-top:3px}

.p{font-size:13.5px;margin-bottom:10px}
.p:last-child{margin-bottom:0}
.lead{font-weight:600}
.muted{font-size:12.5px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;margin:20px 0 9px}
.sec:first-child{margin-top:0}

.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}

.tbl{width:100%;border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.tbl thead,.tbl tbody,.tbl tr{display:table;width:100%;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:9px 11px}
.tbl td{padding:10px 11px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.tbl th:first-child,.tbl td:first-child{width:70px;white-space:nowrap}

.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.item-t{font-size:14px;font-weight:600;line-height:1.4}
.item-m{font-size:11px;margin-top:7px}
.item-b{font-size:13px;margin-top:6px}
.verdict{font-size:13px;font-weight:600;border-radius:9px;padding:11px 13px;margin-top:11px;border-left:3px solid var(--amb)}
.v-why{font-size:12.5px;font-weight:400;margin-top:5px}
.acts{margin-top:13px}

.btn{border:0;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.age{font-size:11px;margin-top:5px}
.note{font-size:12.5px;border-radius:10px;padding:12px 14px;border-left:3px solid var(--gold);margin-bottom:16px}

.f{margin-bottom:18px}
.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.hint{display:block;font-size:12px;margin-bottom:9px}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5}
.ta{min-height:88px;resize:vertical}
.inp:focus,.ta:focus{outline:2px solid var(--gold);outline-offset:-1px}
.chip{border:1px solid var(--line);border-radius:9px;padding:10px 14px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:500}
.file{display:block;width:100%;border:1px dashed var(--line);border-radius:10px;padding:14px;font-size:13px;text-align:center;cursor:pointer;transition:.15s}
.file input{display:none}
.mrep{margin-left:auto;border:0;border-radius:9px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto}
.ok{text-align:center;padding:26px 10px}
.ok-i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 14px;font-size:22px;font-weight:700}
.ok-m{font-size:17px;font-weight:600;margin-bottom:6px}
.ok-s{font-size:13px;max-width:400px;margin:0 auto 18px}

.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}
.scrim.on{display:block}

@media(min-width:900px){
  .side{position:sticky;height:100vh;transform:none}
  .scrim,.burger,.mrep{display:none!important}
  .main{padding:22px 30px 60px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .top-t{font-size:23px}

.clamp{position:relative;overflow:hidden;max-height:280px}
.clamp.open{max-height:none}
.clamp:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:76px;
  background:linear-gradient(to bottom,rgba(14,19,40,0) 0%,#0e1328 92%);pointer-events:none}

.bp{font-size:13.5px;line-height:1.68;color:#cbd5e5;margin:0 0 12px;max-width:68ch}
.bl{margin:0 0 13px;padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:7px}

.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;margin:0 0 18px;

.meta dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);
  font-weight:600;padding-top:2px;white-space:nowrap}
.meta dd{font-size:13px;color:#e6ebf5;margin:0}
.tblwrap{overflow-x:auto;margin:0 0 16px}
.btbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.btbl th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;color:var(--dim);background:var(--lift);padding:9px 12px;white-space:nowrap}
.btbl th:first-child{border-radius:8px 0 0 0} .btbl th:last-child{border-radius:0 8px 0 0}
.btbl td{padding:10px 12px;border-top:1px solid var(--line);color:#cbd5e5;vertical-align:top;line-height:1.5}

<script>
/* Backend: Supabase project SBD OPS. Same pattern as index.html: a hand-rolled
   rpc() over fetch, no SDK, no build step. The publishable key lives in the page
   by design. Every read and write here additionally requires a signed-in user
   whose app_users row says master_admin; RLS and the functions enforce that in
   the database, not in this page. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

const esc=t=>String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const fmtD=d=>d?new Date(d+(String(d).length===10?'T12:00:00':'')).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const ageDays=d=>Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/86400000));
const agePill=n=>P(n>=30?'p-red':n>=10?'p-amb':'p-gry',`${n} day${n===1?'':'s'}`);
const stPill=s=>({'shipped':P('p-grn','Shipped'),'in-progress':P('p-amb','In progress'),'blocked':P('p-red','Blocked'),'backlog':P('p-gry','Backlog'),'open':P('p-gry','Open')}[s]||P('p-gry',esc(s)));
const impPill=i=>P(i==='Blocking me now'?'p-red':i==='Slowing me down'?'p-amb':'p-gry',esc(i));
const today=()=>new Date().toISOString().slice(0,10);

const hdrs=()=>({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`});

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:hdrs(),body:JSON.stringify(args||{})});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Something went wrong on our side.');
  return d;
}
async function q(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:hdrs()});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Could not load data.');
  return d||[];
}

/* Renders the brief the way the document reads: section headings, sub-headings,
   bullets, tables, and bold. Escapes first, so document text can never inject. */
function md(src){
  if(!src) return '';
  const lines=String(src).split(/\r?\n/);
  const inline=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\b(https?:\/\/[^\s<]+)/g,'<span class="mono">$1</span>');
  let out='',list=[],tbl=[];
  const flushList=()=>{ if(list.length){ out+='<ul class="bl">'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; list=[]; } };
  const flushTbl=()=>{
    if(!tbl.length) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const rows=tbl.filter(r=>!/^\|(?:\s*:?-+:?\s*\|)+$/.test(r));
    const head=cells(rows[0]), body=rows.slice(1).map(cells);
    // a two-column table with a blank header is a From/To/Platform block, not a grid
    const defn = head.length===2 && head.every(h=>!h);
    if(defn){
      out+='<dl class="meta">'+body.map(([k,v])=>
        `<dt>${inline(k)}</dt><dd>${inline(v||'')}</dd>`).join('')+'</dl>';
    }else{
      out+='<div class="tblwrap"><table class="btbl"><thead><tr>'+
        head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+
        '</tbody></table></div>';
    }
    tbl=[];
  };
  for(const raw of lines){
    const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ flushList(); tbl.push(l); continue; }
    flushTbl();
    if(/^[-*]\s+/.test(l)){ list.push(inline(l.replace(/^[-*]\s+/,''))); continue; }
    flushList();
    if(!l) continue;
    if(/^###\s+/.test(l))      out+=`<div class="bh3">${inline(l.replace(/^###\s+/,''))}</div>`;
    else if(/^##\s+/.test(l))  out+=`<div class="bh2">${inline(l.replace(/^##\s+/,''))}</div>`;
    else if(/^#\s+/.test(l))   out+=`<div class="bh1">${inline(l.replace(/^#\s+/,''))}</div>`;
    else out+=`<p class="bp">${inline(l)}</p>`;
  }
  flushList(); flushTbl();
  return out;
}

/* ---------- state ---------- */
const D={intake:[],board:[],decisions:[],releases:[],refdocs:[],briefs:[],eods:[],addenda:[],snaps:[],tiers:[],fns:[]};
const fnLabel=s=>(D.fns.find(f=>f.slug===s)||{}).label||s||'';
const trackerByRef=r=>D.board.find(t=>t.intake_ref===r);
const sprintNow=()=>{const c=[...D.board].filter(t=>t.sprint&&t.status!=='shipped').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return c.length?c[0].sprint:null;};
const isStale=t=>(t.status==='shipped'&&!t.shipped_on)||(['open','in-progress','blocked'].includes(t.status)&&ageDays(t.updated_at)>=14);

async function loadAll(){
  rpc('snapshot_tracker').catch(()=>{});
  const [intake,board,decisions,releases,refdocs,briefs,eods,addenda,snaps,tiers,fns]=await Promise.all([
    q('intake?select=ref,who,sips_function,area,impact,what,expected,status,severity,verdict,analysis,decision,decided_at,submitted_at,tracker_item_id&order=submitted_at.asc'),
    q('tracker_items?select=number,title,status,priority,sprint,owner,source,intake_ref,note,shipped_on,review_on,rank,how_to_check,verified_note,verified_at,created_at,updated_at&order=number.asc'),
    q('decisions?select=ref,question,blocks,raised_on,status,answer,reasoning,answered_on,review_on,verdict&order=raised_on.asc'),
    q('releases?select=released_on,outcome,summary,detail,verification,item_numbers&order=released_on.desc&limit=25'),
    q('reference_docs?select=slug,title,body'),
    q('briefs?select=brief_date,author,body&order=brief_date.desc&limit=5'),
    q('eod_reports?select=report_date,author,completed,qa,still_working,needs_ignacio&order=report_date.desc&limit=14'),
    q('eod_addenda?select=addendum_date,author,author_role,body,created_at&order=created_at.desc&limit=40'),
    q('tracker_snapshots?select=snap_date,number,title,status,rank,sprint&order=snap_date.desc,number.asc'),
    q('severity_tiers?select=tier,name,escalates&order=tier.asc'),
    q('sips_functions?select=slug,label&order=sort.asc')
  ]);
  Object.assign(D,{intake,board,decisions,releases,refdocs,briefs,eods,addenda,snaps,tiers,fns});
}

/* ---------- views ---------- */
function todayHTML(){
  const need=D.intake.filter(i=>i.status==='new');
  const open=D.decisions.filter(d=>d.status==='open').sort((a,b)=>new Date(a.raised_on)-new Date(b.raised_on));
  const oldest=open.length?ageDays(open[0].raised_on):0;
  const stale=D.board.filter(isStale);
  const sp=sprintNow();
  const spItems=D.board.filter(t=>t.sprint===sp);
  const spDone=spItems.filter(t=>t.status==='shipped').length;
  const brief=D.briefs[0];
  return `
<div class="grid">
  <button class="stat" data-go="intake"><div class="stat-v">${need.length}</div><div class="stat-l">Need a decision</div><div class="stat-d">from the admin team</div></button>
  <button class="stat" data-go="decisions"><div class="stat-v">${open.length}</div><div class="stat-l">Open decisions</div><div class="stat-d">${open.length?`oldest ${oldest} days`:'nothing waiting'}</div></button>
  <button class="stat" data-go="tracker"><div class="stat-v">${stale.length}</div><div class="stat-l">Stale rows</div><div class="stat-d">flagged automatically</div></button>
  <button class="stat" data-go="tracker"><div class="stat-v">${sp?`${spDone}/${spItems.length}`:'&ndash;'}</div><div class="stat-l">${sp?esc(sp):'Sprint'}</div><div class="stat-d">${sp?'shipped vs committed':'no sprint set'}</div></button>
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Blocking someone right now</div></div>
  ${open.filter(d=>d.blocks).slice(0,4).map(d=>`
  <div class="item"><div class="item-h"><div class="item-t">${esc(d.question)}</div>${agePill(ageDays(d.raised_on))}</div>
  <div class="item-m">${esc(d.blocks)}</div></div>`).join('')||'<div class="p muted">Nothing is flagged as blocking anyone. Open decisions live under Decisions.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Daily brief</div><div class="card-s">${brief?`Latest sent ${fmtD(brief.brief_date)}`:'Nothing sent yet'}</div></div>
  ${brief?briefBlock(brief.body):'<div class="p muted">No brief has been posted yet. The first one you send from here appears on the dev team’s board the moment they refresh.</div>'}
  <div class="sec">Send ${brief?'a new one':'the first one'}</div>
  <div class="f"><textarea class="ta" id="briefBody" placeholder="Priorities, in order. 1. ..."></textarea></div>
  <div class="row"><button class="btn btn-g" data-act="sendBrief">Send brief for today</button></div>
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Forgot to mention</div>
  <div class="card-s">Things that should have been in a daily report but were not. Pushed through here, dated, and visible to both sides.</div></div>
  <div class="f"><textarea class="ta" id="addBody" style="min-height:64px" placeholder="One thing, in plain words."></textarea></div>
  <div class="row" style="margin-bottom:14px"><button class="btn btn-g" data-act="addendum">Push it through</button></div>
  ${D.addenda.length?D.addenda.slice(0,10).map(a=>`
  <div class="item"><div class="item-b" style="margin-top:0">${esc(a.body)}</div>
  <div class="item-m">${fmtD(a.addendum_date)} &middot; ${esc(a.author)} &middot; ${a.author_role==='master_admin'?'master admin':'dev team'}</div></div>`).join('')
  :'<div class="p muted">Nothing yet. Anything pushed through shows up here with a date on it.</div>'}
</div>`;
}

function intakeHTML(){
  const open=D.intake.filter(i=>i.status==='new');
  const done=D.intake.filter(i=>i.status!=='new').sort((a,b)=>new Date(b.decided_at||0)-new Date(a.decided_at||0));
  const sevOpts=D.tiers.map(t=>`<option value="${t.tier}">${t.tier} &middot; ${esc(t.name)}</option>`).join('');
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Needs a decision</div>
  <div class="card-s">Nothing here has changed anything yet</div></div>
  ${open.length?open.map(i=>`
  <div class="item">
    <div class="item-h"><div class="item-t">${esc(i.what).slice(0,140)}</div>${impPill(i.impact)}</div>
    ${i.expected?`<div class="item-b">Expected: ${esc(i.expected)}</div>`:''}
    <div class="item-m">${esc(i.ref)} &middot; ${esc(i.who)} &middot; ${esc(fnLabel(i.sips_function))} &middot; ${esc(i.area)} &middot; ${ageDays(i.submitted_at)} day${ageDays(i.submitted_at)===1?'':'s'} old</div>
    <div class="f" style="margin:12px 0 10px"><label class="lbl">Severity</label>
      <select class="inp" id="sev-${esc(i.ref)}" style="max-width:280px"><option value="">Not set</option>${sevOpts}</select></div>
    <div class="f" style="margin-bottom:10px"><label class="lbl">Verdict</label>
      <input class="inp" id="ver-${esc(i.ref)}" placeholder="Already built, not reachable / Confirmed / Not a defect ..."></div>
    <div class="f" style="margin-bottom:10px"><label class="lbl">What was verified</label>
      <textarea class="ta" id="ana-${esc(i.ref)}" style="min-height:60px" placeholder="Evidence separately from inference. Name the query, commit or record."></textarea></div>
    <div class="f" style="margin-bottom:12px"><label class="lbl">Note to the submitter</label>
      <input class="inp" id="dec-${esc(i.ref)}" placeholder="What they hear back."></div>
    <div class="row acts" style="margin-top:0">
      <button class="btn btn-g" data-triage="approved" data-ref="${esc(i.ref)}">Approve</button>
      <button class="btn btn-o" data-triage="tabled" data-ref="${esc(i.ref)}">Table</button>
      <button class="btn btn-r" data-triage="closed" data-ref="${esc(i.ref)}">Deny</button>
    </div>
  </div>`).join(''):'<div class="p muted">Nothing waiting. Everything submitted has been decided.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Decided</div><div class="card-s">The submitter reads the outcome from their own page</div></div>
  ${done.length?done.map(i=>{
    const t=i.tracker_item_id?D.board.find(b=>b.intake_ref===i.ref):null;
    const pill=i.status==='approved'||i.status==='shipped'?P('p-grn',esc(i.status)):P('p-gry',esc(i.status));
    return `<div class="item done">
    <div class="item-h"><div class="item-t">${esc(i.what).slice(0,120)}</div>${pill}</div>
    ${i.verdict?`<div class="verdict">${esc(i.verdict)}${i.analysis?`<div class="v-why">${esc(i.analysis)}</div>`:''}</div>`:''}
    <div class="item-m">${esc(i.ref)} &middot; decided ${fmtD(i.decided_at)}${t?` &middot; tracker #${t.number}`:''}</div>
    ${i.status==='approved'&&!i.tracker_item_id?`
    <div class="row" style="margin-top:11px">
      <input class="inp" id="pt-${esc(i.ref)}" style="flex:1;min-width:180px" value="${esc(i.what).slice(0,120).replace(/"/g,'')}" placeholder="Tracker title">
      <select class="inp" id="pp-${esc(i.ref)}" style="width:110px"><option>medium</option><option>high</option><option>critical</option><option>low</option></select>
      <button class="btn btn-g" data-promote="${esc(i.ref)}">To tracker</button>
    </div>`:''}
    </div>`;}).join(''):'<div class="p muted">Nothing decided yet. Decisions made above land here with their outcome.</div>'}
</div>`;
}

function trackerHTML(){
  const ranked=D.board.filter(t=>t.rank!=null).sort((a,b)=>a.rank-b.rank||a.number-b.number);
  const unranked=D.board.filter(t=>t.rank==null&&t.status!=='shipped');
  const stale=D.board.filter(isStale).sort((a,b)=>ageDays(b.updated_at)-ageDays(a.updated_at));
  const sp=sprintNow();
  const rows=[...D.board].sort((a,b)=>a.number-b.number);
  const stOpts=s=>['open','in-progress','shipped','blocked','backlog'].map(x=>`<option${x===s?' selected':''}>${x}</option>`).join('');
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Priority order</div>
  <div class="card-s">Set from here. The dev team sees this order the next time they refresh.</div></div>
  ${ranked.length?ranked.map(t=>`
  <div class="item"><div class="item-h"><div class="item-t">${t.rank}. &nbsp;#${t.number} &middot; ${esc(t.title)}</div>${stPill(t.status)}</div>
  <div class="row" style="margin-top:9px">
    <input class="inp" id="rk-${t.number}" type="number" min="1" value="${t.rank}" style="width:76px">
    <button class="btn" data-rank="${t.number}">Move</button>
    <button class="btn btn-o" data-unrank="${t.number}">Remove from queue</button>
  </div></div>`).join(''):'<div class="p muted">Nothing is ranked yet. Rank 1 means do this first.</div>'}
  ${unranked.length?`
  <div class="sec">Add to the queue</div>
  <div class="row">
    <select class="inp" id="rkPick" style="flex:1;min-width:200px">${unranked.map(t=>`<option value="${t.number}">#${t.number} &middot; ${esc(t.title).slice(0,70)}</option>`).join('')}</select>
    <input class="inp" id="rkNew" type="number" min="1" placeholder="Rank" style="width:86px">
    <button class="btn btn-g" data-act="rankPick">Set</button>
  </div>`:''}
  <div class="sec">Push a new priority in</div>
  <div class="f" style="margin-bottom:10px"><input class="inp" id="ptTitle" placeholder="What needs doing"></div>
  <div class="row">
    <select class="inp" id="ptPrio" style="width:110px"><option>high</option><option>critical</option><option>medium</option><option>low</option></select>
    <input class="inp" id="ptRank" type="number" min="1" placeholder="Rank" style="width:86px">
    <button class="btn btn-g" data-act="pushTask">Push it</button>
  </div>
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Flagged automatically</div>
  <div class="card-s">Marked shipped with no date, or untouched for 14 days while open</div></div>
  ${stale.length?`<table class="tbl"><thead><tr><th>#</th><th>Item</th><th>Status</th></tr></thead><tbody>
  ${stale.map(t=>`<tr><td>${t.number}</td><td>${esc(t.title)}<div class="age">${t.status==='shipped'&&!t.shipped_on?'Marked shipped with no date':`Untouched ${ageDays(t.updated_at)} days`}</div></td><td>${P('p-amb','Stale')}</td></tr>`).join('')}
  </tbody></table>`:'<div class="p muted">Nothing is stale. Every open row has been touched inside two weeks.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">The ledger</div><div class="card-s">${sp?`Current sprint ${esc(sp)} &middot; `:''}${rows.length} items &middot; status changes write straight to the record</div></div>
  <table class="tbl"><thead><tr><th>#</th><th>Item</th><th>Change</th></tr></thead><tbody>
  ${rows.map(t=>`<tr><td>${t.number}</td>
  <td>${esc(t.title)}<div class="age">${[t.sprint?esc(t.sprint):'',t.intake_ref?'from '+esc(t.intake_ref):'',t.shipped_on?'shipped '+fmtD(t.shipped_on):'',t.review_on?'review '+fmtD(t.review_on):''].filter(Boolean).join(' &middot; ')||'&nbsp;'}</div>
  ${t.status==='shipped'?(t.verified_note?`<div class="proof"><span class="proof-l">Verified${t.verified_at?' '+fmtD(t.verified_at):''}</span>${esc(t.verified_note)}</div>`:'<div class="noproof">Shipped with no evidence recorded</div>'):''}</td>
  <td><div class="row" style="gap:5px">
    <select class="inp" id="st-${t.number}" style="width:118px;padding:8px 9px;font-size:12px">${stOpts(t.status)}</select>
    <input class="inp" id="dt-${t.number}" type="date" style="width:132px;padding:8px 9px;font-size:12px">
    <button class="btn" data-upd="${t.number}">Apply</button>
    <input class="inp" id="vf-${t.number}" placeholder="How you checked it is live${t.status==='shipped'?'':' (needed to ship)'}" style="width:100%;padding:8px 9px;font-size:12px">
  </div></td></tr>`).join('')}
  </tbody></table>
  <div class="p muted" style="margin-top:10px">Shipped needs a ship date <em>and</em> a line on how it was checked against the running system. Backlog needs a review date.</div>
</div>`;
}

function historyHTML(){
  const dates=[...new Set(D.snaps.map(s=>s.snap_date))].sort().reverse();
  const t=today();
  const prevDate=dates.find(d=>d<t);
  const prev=prevDate?D.snaps.filter(s=>s.snap_date===prevDate):[];
  const nowBy=Object.fromEntries(D.board.map(b=>[b.number,b]));
  const rolled=prev.filter(s=>s.status!=='shipped'&&nowBy[s.number]&&nowBy[s.number].status!=='shipped');
  const cleared=prev.filter(s=>s.status!=='shipped'&&nowBy[s.number]&&nowBy[s.number].status==='shipped');
  const newSince=prevDate?D.board.filter(b=>!prev.some(s=>s.number===b.number)):[];
  const pending=D.board.filter(b=>['open','in-progress','blocked'].includes(b.status)).sort((a,b)=>(a.rank??999)-(b.rank??999)||a.number-b.number);
  const review=D.decisions.filter(d=>d.status==='tabled'&&d.review_on);
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">${prevDate?`Since ${fmtD(prevDate)}`:'Yesterday'}</div>
  <div class="card-s">What carried over, what cleared, what is new</div></div>
  ${!prevDate?'<div class="p muted">History starts collecting from today. A snapshot of the tracker is taken every time a surface loads; from tomorrow this shows exactly what rolled over overnight and what got cleared.</div>':`
  ${rolled.length?`<div class="sec">Rolled over &middot; ${rolled.length}</div>`+rolled.map(s=>`
    <div class="item"><div class="item-h"><div class="item-t">#${s.number} &middot; ${esc(s.title)}</div>${P('p-amb','Rolled over')}</div>
    <div class="item-m">${esc(s.status)} on ${fmtD(prevDate)} &middot; ${esc(nowBy[s.number].status)} now</div></div>`).join(''):'<div class="p muted">Nothing rolled over.</div>'}
  ${cleared.length?`<div class="sec">Cleared &middot; ${cleared.length}</div>`+cleared.map(s=>`
    <div class="item"><div class="item-h"><div class="item-t">#${s.number} &middot; ${esc(s.title)}</div>${P('p-grn','Cleared')}</div>
    <div class="item-m">was ${esc(s.status)} on ${fmtD(prevDate)} &middot; shipped ${nowBy[s.number].shipped_on?fmtD(nowBy[s.number].shipped_on):''}</div></div>`).join(''):''}
  ${newSince.length?`<div class="sec">New since &middot; ${newSince.length}</div>`+newSince.map(b=>`
    <div class="item"><div class="item-h"><div class="item-t">#${b.number} &middot; ${esc(b.title)}</div>${stPill(b.status)}</div></div>`).join(''):''}`}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Pending now</div><div class="card-s">Everything open, in priority order where one is set</div></div>
  ${pending.length?pending.map(b=>`
  <div class="item"><div class="item-h"><div class="item-t">${b.rank!=null?b.rank+'. &nbsp;':''}#${b.number} &middot; ${esc(b.title)}</div>${stPill(b.status)}</div>
  <div class="item-m">${[b.sprint?esc(b.sprint):'',`untouched ${ageDays(b.updated_at)} days`].filter(Boolean).join(' &middot; ')}</div></div>`).join(''):'<div class="p muted">Nothing pending. The board is clear.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Parked for review</div><div class="card-s">Tabled decisions with a date to come back on</div></div>
  ${review.length?review.map(d=>`
  <div class="item"><div class="item-h"><div class="item-t">${esc(d.question)}</div>${P('p-gry','Review '+fmtD(d.review_on))}</div>
  ${d.reasoning?`<div class="item-b">${esc(d.reasoning)}</div>`:''}
  <div class="item-m">${esc(d.ref)} &middot; raised ${fmtD(d.raised_on)}</div></div>`).join(''):'<div class="p muted">Nothing is parked. Tabled decisions with a review date appear here.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">The record</div><div class="card-s">One line per day the tracker was photographed</div></div>
  ${dates.length?`<table class="tbl"><thead><tr><th>Date</th><th>Items</th><th>Shipped</th><th>Open</th></tr></thead><tbody>
  ${dates.slice(0,30).map(d=>{const rows=D.snaps.filter(s=>s.snap_date===d);
    return `<tr><td>${fmtD(d)}</td><td>${rows.length}</td><td>${rows.filter(r=>r.status==='shipped').length}</td><td>${rows.filter(r=>r.status!=='shipped').length}</td></tr>`;}).join('')}
  </tbody></table>`:'<div class="p muted">No snapshots yet. The first one was taken when this page loaded; the table starts tomorrow.</div>'}
</div>`;
}

function decisionsHTML(){
  const open=D.decisions.filter(d=>d.status==='open').sort((a,b)=>new Date(a.raised_on)-new Date(b.raised_on));
  const closed=D.decisions.filter(d=>d.status!=='open').sort((a,b)=>new Date(b.answered_on||b.raised_on)-new Date(a.answered_on||a.raised_on));
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Open</div><div class="card-s">Age is the thing to watch</div></div>
  ${open.length?open.map(d=>`
  <div class="item">
    <div class="item-h"><div class="item-t">${esc(d.question)}</div>${agePill(ageDays(d.raised_on))}</div>
    ${d.blocks?`<div class="item-m">Blocks: ${esc(d.blocks)}</div>`:''}
    <div class="f" style="margin:11px 0 9px"><label class="lbl">Answer</label>
      <textarea class="ta" id="ans-${esc(d.ref)}" style="min-height:58px" placeholder="The decision, in a sentence or two."></textarea></div>
    <div class="f" style="margin-bottom:11px"><label class="lbl">Reasoning</label>
      <input class="inp" id="rsn-${esc(d.ref)}" placeholder="Why, so it stays decided."></div>
    <div class="row">
      <button class="btn btn-g" data-answer="${esc(d.ref)}">Answer it</button>
      <input class="inp" id="rev-${esc(d.ref)}" type="date" style="width:150px">
      <button class="btn btn-o" data-table="${esc(d.ref)}">Table until date</button>
    </div>
  </div>`).join(''):'<div class="p muted">Nothing open. Questions the dev team raises land here with their age.</div>'}
</div>
<div class="card max">
  <div class="card-h"><div class="card-t">Decided</div><div class="card-s">Answered once, stays answered</div></div>
  ${closed.length?closed.map(d=>`
  <div class="item"><div class="item-h"><div class="item-t">${esc(d.question)}</div>${d.status==='answered'?P('p-grn',esc(d.verdict||'Answered')):P('p-gry','Tabled')}</div>
  ${d.answer?`<div class="item-b">${esc(d.answer)}${d.reasoning?' &mdash; '+esc(d.reasoning):''}</div>`:d.reasoning?`<div class="item-b">${esc(d.reasoning)}</div>`:''}
  <div class="item-m">${esc(d.ref)} &middot; ${d.answered_on?fmtD(d.answered_on):'raised '+fmtD(d.raised_on)}${d.review_on?' &middot; review '+fmtD(d.review_on):''}</div></div>`).join(''):'<div class="p muted">Nothing decided yet.</div>'}
</div>`;
}

function capHTML(){
  const order=['capability','limitations','standards','severity','glossary','surfaces'];
  const docs=[...D.refdocs].sort((a,b)=>order.indexOf(a.slug)-order.indexOf(b.slug));
  if(!docs.length) return '<div class="card max"><div class="card-h"><div class="card-t">Reference</div></div><div class="p muted">No reference documents are in the database yet. Once capability, limitations and standards are loaded they render here.</div></div>';
  return docs.map(r=>`<div class="card max"><div class="card-h"><div class="card-t">${esc(r.title)}</div></div>${md(r.body)||'<div class="p muted">Empty.</div>'}</div>`).join('');
}

function releasesHTML(){
  const byNum=Object.fromEntries(D.board.map(b=>[b.number,b.title]));
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Recent</div><div class="card-s">Merged, deployed and confirmed are three separate facts</div></div>
  ${D.releases.length?D.releases.map(r=>`
  <div class="item"><div class="item-h"><div class="item-t">${fmtD(r.released_on)} &middot; ${esc(r.summary)}</div>${r.outcome==='live'?P('p-grn','Live'):P('p-red','Rolled back')}</div>
  ${r.detail?`<div class="item-b">${esc(r.detail)}</div>`:''}
  <div class="item-m">${[r.verification?'Verified: '+esc(r.verification):'',(r.item_numbers||[]).length?(r.item_numbers||[]).map(n=>byNum[n]?`#${n} ${esc(byNum[n]).slice(0,40)}`:`#${n}`).join(', '):''].filter(Boolean).join(' &middot; ')||'No verification recorded'}</div></div>`).join('')
  :'<div class="p muted">No releases logged yet. The dev team posts them from their page; each lands here with its verification.</div>'}
</div>`;
}


/* The brief runs to thousands of words. Show the opening, let it be opened. */
let briefOpen=false;
function briefBlock(body){
  if(!body) return '';
  const short = body.length < 700;
  if(short) return md(body);
  return `<div class="clamp${briefOpen?' open':''}">${md(body)}</div>
  <div class="morebar"><div class="rule"></div>
    <button class="btn" data-brief="1">${briefOpen?'See less':'See more'}</button>
    <div class="rule"></div></div>`;
}

/* ---------- registry, nav, draw ---------- */
const V={
  today:{n:'Today',s:new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),h:todayHTML},
  intake:{n:'Intake',s:'From the SIPS admin team',b:()=>D.intake.filter(i=>i.status==='new').length,h:intakeHTML},
  tracker:{n:'Tracker',s:'The ledger',b:()=>D.board.filter(isStale).length,h:trackerHTML},
  history:{n:'History',s:'Rollover, pending, the record',h:historyHTML},
  decisions:{n:'Decisions',s:'Open queue and the log',b:()=>D.decisions.filter(d=>d.status==='open').length,h:decisionsHTML},
  cap:{n:'What it does',s:'Present tense only',h:capHTML},
  releases:{n:'Releases',s:'What is actually live',h:releasesHTML}
};
const REVIEW=['today','intake','tracker','history','decisions','cap','releases'];
const nav=document.getElementById('nav'), views=document.getElementById('views');
const side=document.getElementById('side'), scrim=document.getElementById('scrim'), toast=document.getElementById('toast');
const refreshBtn=document.getElementById('refresh');
let cur='today';

function drawNav(){
  nav.innerHTML='<div class="nav-l">Review</div>'+REVIEW.map(k=>{
    const b=V[k].b?V[k].b():0;
    return `<button class="nav-i${k===cur?' on':''}" data-k="${k}"><span>${V[k].n}</span>${b?`<span class="nav-n">${b}</span>`:''}</button>`;
  }).join('');
}
function draw(){
  views.innerHTML=`<div class="view on">${V[cur].h()}</div>`;
  document.getElementById('ttl').textContent=V[cur].n;
  document.getElementById('sub').textContent=V[cur].s;
  drawNav(); window.scrollTo(0,0);
}
function go(k){ cur=k; draw(); shut(); }
function shut(){ side.classList.remove('open'); scrim.classList.remove('on'); }
function say(m){ toast.textContent=m; toast.classList.add('on'); setTimeout(()=>toast.classList.remove('on'),2600); }

/* ---------- auth ---------- */


async function boot(){
  try{
    views.innerHTML='<div class="view on"><div class="p muted">Loading the record...</div></div>';
    await loadAll();
    refreshBtn.hidden=false;
    draw();
  }catch(e){
    views.innerHTML=`<div class="view on"><div class="card max"><div class="card-t">Could not load</div><div class="p" style="margin-top:8px">${esc(e.message)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="location.reload()">Try again</button></div></div></div>`;
  }
}

async function refresh(quiet){
  try{ await loadAll(); draw(); if(!quiet) say('Refreshed. This is the record as of right now.'); }
  catch(e){ say(e.message); }
}

/* ---------- actions ---------- */
async function act(fn){
  try{ await fn(); await refresh(true); }
  catch(e){ say(e.message); }
}
const val=id=>{const n=document.getElementById(id);return n?n.value.trim():'';};

document.addEventListener('click',e=>{
  const n=e.target.closest('.nav-i'); if(n) return go(n.dataset.k);
  const s=e.target.closest('.stat[data-go]'); if(s) return go(s.dataset.go);
  if(e.target===refreshBtn) return refresh();
  if(e.target.closest('[data-brief]')){ briefOpen=!briefOpen; return draw(); }

  const tr=e.target.closest('[data-triage]');
  if(tr){ const ref=tr.dataset.ref, st=tr.dataset.triage;
    return act(async()=>{ await rpc('triage_intake',{p_ref:ref,
      p_severity:val('sev-'+ref)?Number(val('sev-'+ref)):null,
      p_verdict:val('ver-'+ref)||null, p_analysis:val('ana-'+ref)||null,
      p_decision:val('dec-'+ref)||null, p_status:st});
      say(st==='approved'?'Approved. Promote it to the tracker below when ready.':st==='tabled'?'Tabled. The submitter sees it as tabled.':'Closed on our side. The submitter sees it as tabled.'); }); }

  const pm=e.target.closest('[data-promote]');
  if(pm){ const ref=pm.dataset.promote;
    return act(async()=>{ const num=await rpc('promote_intake',{p_ref:ref,p_title:val('pt-'+ref),p_priority:val('pp-'+ref)||'medium',p_sprint:sprintNow()});
      say(`On the tracker as #${num}.`); }); }

  const rk=e.target.closest('[data-rank]');
  if(rk){ const num=Number(rk.dataset.rank);
    return act(async()=>{ await rpc('set_rank',{p_number:num,p_rank:Number(val('rk-'+num))||1}); say('Order updated. Devs see it on their next refresh.'); }); }
  const ur=e.target.closest('[data-unrank]');
  if(ur) return act(async()=>{ await rpc('set_rank',{p_number:Number(ur.dataset.unrank),p_rank:null}); say('Removed from the priority queue.'); });

  const up=e.target.closest('[data-upd]');
  if(up){ const num=Number(up.dataset.upd);
    return act(async()=>{ const st=val('st-'+num), dt=val('dt-'+num)||null;
      await rpc('update_tracker',{p_number:num,p_status:st,
        p_shipped_on:st==='shipped'?(dt||today()):null,
        p_review_on:st==='backlog'?dt:null,
        p_verified:val('vf-'+num)||null});
      say(`#${num} is now ${st}.`); }); }

  const an=e.target.closest('[data-answer]');
  if(an){ const ref=an.dataset.answer;
    return act(async()=>{ await rpc('answer_decision',{p_ref:ref,p_verdict:null,p_answer:val('ans-'+ref),p_reasoning:val('rsn-'+ref)||null,p_review_on:null});
      say('Answered. It stays answered.'); }); }
  const tb=e.target.closest('[data-table]');
  if(tb){ const ref=tb.dataset.table;
    return act(async()=>{ const d=val('rev-'+ref); if(!d) throw new Error('Tabling needs a review date.');
      await rpc('answer_decision',{p_ref:ref,p_verdict:null,p_answer:val('ans-'+ref)||null,p_reasoning:val('rsn-'+ref)||null,p_review_on:d});
      say('Tabled with a date to come back on.'); }); }

  const a=e.target.closest('[data-act]');
  if(a){
    if(a.dataset.act==='sendBrief') return act(async()=>{ await rpc('send_brief',{p_date:today(),p_body:val('briefBody')}); say('Brief sent. The dev team sees it on refresh.'); });
    if(a.dataset.act==='addendum')  return act(async()=>{ await rpc('post_addendum',{p_body:val('addBody'),p_author:'Ignacio'}); say('Pushed through, with a date on it.'); });
    if(a.dataset.act==='rankPick')  return act(async()=>{ await rpc('set_rank',{p_number:Number(val('rkPick')),p_rank:Number(val('rkNew'))||1}); say('Added to the priority queue.'); });
    if(a.dataset.act==='pushTask')  return act(async()=>{ const n=await rpc('add_task',{p_title:val('ptTitle'),p_priority:val('ptPrio')||'high',p_rank:Number(val('ptRank'))||null,p_sprint:sprintNow(),p_note:'Pushed in from the master surface'});
      say(`On the tracker as #${n}${val('ptRank')?', rank '+val('ptRank'):''}.`); });
  }
});
document.getElementById('burger').onclick=()=>{side.classList.add('open');scrim.classList.add('on');};
scrim.onclick=shut;
boot();
</script>
</body>
</html>
