<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Report something &middot; SBD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D49A00;--ink:#070d1f;--card:#0e1328;--line:#1c2646;--lift:#131b3a;
--dim:#94a3b8;--mut:#64748b;--red:#f0616d;--amb:#e0a132;--grn:#3fb984}

/* ── SIMVOLY / BAKND EMBED COLOR LOCK ─────────────────────────── */
@layer host-reset{ #sbd-root, #sbd-root *{ box-sizing:border-box !important; } }
#sbd-root, #sbd-root div,#sbd-root span,#sbd-root p,#sbd-root a,#sbd-root li,
#sbd-root h1,#sbd-root h2,#sbd-root h3,#sbd-root label,#sbd-root input,
#sbd-root textarea,#sbd-root button{font-family:'Poppins',-apple-system,'Segoe UI',sans-serif !important;}
#sbd-root{background:#070d1f !important;color:#e6ebf5 !important;}
#sbd-root .hd{background:#0a1024 !important;border-color:#1c2646 !important;}
#sbd-root .bmark{background:#D49A00 !important;color:#000000 !important;}
#sbd-root .bname{color:#ffffff !important;}
#sbd-root .bsub{color:#94a3b8 !important;}
#sbd-root .tab{background:#0a1024 !important;color:#94a3b8 !important;}
#sbd-root .tab.on{background:#131b3a !important;color:#D49A00 !important;}
#sbd-root .tab-n{background:#1c2646 !important;color:#e6ebf5 !important;}
#sbd-root .card{background:#0e1328 !important;border-color:#1c2646 !important;}
#sbd-root .card-t{color:#ffffff !important;}
#sbd-root .card-s{color:#94a3b8 !important;}
#sbd-root .lbl{color:#ffffff !important;}
#sbd-root .hint{color:#64748b !important;}
#sbd-root .inp,#sbd-root .ta{background:#070d1f !important;color:#e6ebf5 !important;border-color:#1c2646 !important;}
#sbd-root .inp::placeholder,#sbd-root .ta::placeholder{color:#64748b !important;}
#sbd-root .chip{background:#131b3a !important;color:#94a3b8 !important;border-color:#1c2646 !important;}
#sbd-root .chip.on{background:#D49A00 !important;color:#000000 !important;border-color:#D49A00 !important;}
#sbd-root .file{background:#070d1f !important;color:#94a3b8 !important;border-color:#1c2646 !important;}
#sbd-root .file:hover{color:#e6ebf5 !important;border-color:#D49A00 !important;}
#sbd-root .btn{background:#1c2646 !important;color:#94a3b8 !important;}
#sbd-root .btn-g{background:#D49A00 !important;color:#000000 !important;}
#sbd-root .pill{color:#e6ebf5 !important;}
#sbd-root .p-red{background:rgba(240,97,109,.14) !important;color:#f0616d !important;}
#sbd-root .p-amb{background:rgba(224,161,50,.14) !important;color:#e0a132 !important;}
#sbd-root .p-grn{background:rgba(63,185,132,.14) !important;color:#3fb984 !important;}
#sbd-root .p-gry{background:rgba(100,116,139,.18) !important;color:#94a3b8 !important;}
#sbd-root .item{background:#0e1328 !important;border-color:#1c2646 !important;}
#sbd-root .item-t{color:#ffffff !important;}
#sbd-root .item-m{color:#64748b !important;}
#sbd-root .item-b{color:#cbd5e5 !important;}
#sbd-root .known{background:#131b3a !important;color:#94a3b8 !important;}
#sbd-root .known b{color:#e0a132 !important;}
#sbd-root .ok-i{background:#3fb984 !important;color:#000000 !important;}
#sbd-root .ok-m{color:#ffffff !important;}
#sbd-root .ok-s{color:#94a3b8 !important;}
#sbd-root .idbar{background:#131b3a !important;color:#94a3b8 !important;}
#sbd-root .idbar b{color:#ffffff !important;}
#sbd-root .lnk{color:#D49A00 !important;}
#sbd-root .err{background:rgba(240,97,109,.12) !important;color:#f0616d !important;}
#sbd-root .load{color:#64748b !important;}
/* ── END LOCK ──────────────────────────────────────────────────── */

*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.hd{border-bottom:1px solid var(--line);padding:14px 16px;position:sticky;top:0;z-index:10}
.hd-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:11px}
.bmark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 32px}
.bname{font-weight:600;font-size:15px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.tabs{max-width:640px;margin:0 auto;display:flex;gap:6px;padding:11px 0 0}
.tab{flex:1;border:0;border-radius:9px;padding:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:7px}
.tab-n{font-size:11px;border-radius:20px;padding:1px 7px;font-weight:600}
.main{max-width:640px;margin:0 auto;padding:18px 16px 50px}
.view{display:none}.view.on{display:block}

.card{border:1px solid var(--line);border-radius:13px;padding:18px;margin-bottom:13px}
.card-t{font-size:16px;font-weight:600}
.card-s{font-size:13px;margin-top:4px}
.known{font-size:12.5px;border-radius:10px;padding:12px 14px;margin:14px 0 0;border-left:3px solid var(--amb)}
.known b{font-weight:600}

.f{margin-bottom:19px}
.lbl{display:block;font-size:14px;font-weight:600;margin-bottom:3px}
.hint{display:block;font-size:12px;margin-bottom:10px}
.inp,.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:15px;font-family:inherit;line-height:1.5}
.ta{min-height:96px;resize:vertical}
.inp:focus,.ta:focus{outline:2px solid var(--gold);outline-offset:-1px}
.row{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);border-radius:9px;padding:11px 15px;font-size:13.5px;cursor:pointer;font-family:inherit;font-weight:500}
.file{display:block;border:1px dashed var(--line);border-radius:10px;padding:15px;font-size:13px;text-align:center;cursor:pointer}
.file input{display:none}
.btn{border:0;border-radius:9px;padding:13px 24px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}

.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-t{font-size:14px;font-weight:600;line-height:1.4}
.item-b{font-size:13px;margin-top:7px}
.item-m{font-size:11.5px;margin-top:8px}
.ok{text-align:center;padding:30px 12px}
.ok-i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin:0 auto 15px;font-size:24px;font-weight:700}
.ok-m{font-size:18px;font-weight:600;margin-bottom:7px}
.ok-s{font-size:13.5px;max-width:420px;margin:0 auto 20px}
.idbar{font-size:12.5px;border-radius:10px;padding:10px 13px;margin-bottom:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.idbar b{font-weight:600}
.lnk{background:none;border:0;font-family:inherit;font-size:12.5px;cursor:pointer;text-decoration:underline;padding:0}
.err{font-size:13px;border-radius:10px;padding:11px 13px;margin-bottom:13px}
.load{font-size:13px;text-align:center;padding:26px 0}
.btn:disabled{opacity:.55;cursor:default}
@media(min-width:700px){.main{padding:24px 16px 60px}}

/* Speak instead of typing. One floating button follows whichever field has focus,
   so no layout on any page has to make room for it. */
.micb{position:fixed;z-index:60;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line);background:var(--lift);color:var(--dim);
  display:none;place-items:center;cursor:pointer;padding:0;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.micb.on2{display:grid}
.micb:hover{color:var(--gold);border-color:var(--gold)}
.micb.rec{color:#000;background:var(--gold);border-color:var(--gold);
  animation:micp 1.25s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(212,154,0,.55)}
  50%{box-shadow:0 0 0 7px rgba(212,154,0,0)}}
@media(prefers-reduced-motion:reduce){.micb.rec{animation:none}}
.michint{position:fixed;z-index:60;font-size:10.5px;font-weight:600;color:#000;
  background:var(--gold);border-radius:7px;padding:3px 8px;display:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.michint.on2{display:block}
</style>
</head>
<body>
<div id="sbd-root">
<div class="hd">
  <div class="hd-in">
    <div class="bmark">SBD</div>
    <div><div class="bname">Report something</div><div class="bsub">SIPS admin</div></div>
  </div>
  <div class="tabs">
    <button class="tab on" data-t="new">New report</button>
    <button class="tab" data-t="mine">Mine</button>
  </div>
</div>
<div class="main" id="main"></div>
</div>

<script>
/* Backend: Supabase project SBD OPS.
   The publishable key is designed to live in the page. It is not a secret, which is the
   whole reason this page needs no environment variables and no redeploy to configure.
   Both calls go through database functions, never straight at a table. That is what
   stops a submitter reading the triage queue. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`},
    body:JSON.stringify(args)
  });
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Something went wrong on our side. Try again in a moment.');
  return d;
}

const AREAS=['Staff and roster','Assessments','Observations','Schedule','Foundations','Reports','DAVID','Somewhere else'];
const IMPACTS=['Blocking me now','Slowing me down','Minor','Just an idea'];
/* Which part of SIPS the reporter works in. Function is the lens, area is the screen.
   The same list lives in sips_functions in the database, which is what validates it.
   To change it: edit here and update that table. Nothing else needs touching. */
const FUNCTIONS=[
  {slug:'hr',        label:'HR and staffing'},
  {slug:'educator',  label:'Educator'},
  {slug:'assessor',  label:'Assessor'},
  {slug:'proctor',   label:'Proctor'},
  {slug:'leadership',label:'Leadership'},
  {slug:'operations',label:'Scheduling and operations'},
  {slug:'other',     label:'Somewhere else'}
];
const S={who:localStorage.getItem('sbd_who')||'',mail:localStorage.getItem('sbd_mail')||'',
         fn:localStorage.getItem('sbd_fn')||'',tab:'new'};
const okMail=m=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(m||'').trim());
const el=document.getElementById('main');
const esc=t=>String(t||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const chips=(a,d)=>a.map((x,i)=>`<button type="button" class="chip${i===d?' on':''}">${x}</button>`).join('');
const fnLabel=s=>(FUNCTIONS.find(f=>f.slug===s)||{}).label||'';
const idbar=()=>`<div class="idbar">Reporting as <b>${esc(S.who)}</b>${S.fn?` &middot; ${esc(fnLabel(S.fn))}`:''}<button class="lnk" id="chg">change</button></div>`;

function gate(msg){
  el.innerHTML=`<div class="card">
    <div class="card-t">Before you start</div>
    <div class="card-s">Once only. This is remembered on this device.</div>
    ${msg?`<div class="err" style="margin-top:13px">${esc(msg)}</div>`:''}
    <div class="f" style="margin-top:17px"><label class="lbl" for="g1">Your name</label>
      <span class="hint">A return address, so you can be told what happened to what you send.</span>
      <input class="inp" id="g1" value="${esc(S.who)}" placeholder="Jane Doe"></div>
    <div class="f"><label class="lbl" for="g2">Your work email</label>
      <span class="hint">This is what your report gets tracked against, and where the answer goes.</span>
      <input class="inp" id="g2" type="email" inputmode="email" autocomplete="email"
        value="${esc(S.mail)}" placeholder="you@sterilebydesign.ai"></div>
    <div class="f"><label class="lbl">Which part of SIPS you work in</label>
      <span class="hint">Two people can hit the same screen and be looking at different problems. This is how we tell them apart.</span>
      <div class="row" id="gfunc">${FUNCTIONS.map(f=>
        `<button type="button" class="chip${f.slug===S.fn?' on':''}" data-fn="${f.slug}">${f.label}</button>`
      ).join('')}</div></div>
    <button class="btn btn-g" id="gsave">Continue</button>
  </div>`;
  document.getElementById('gsave').onclick=()=>{
    const w=document.getElementById('g1').value.trim();
    const m=document.getElementById('g2').value.trim();
    const f=document.querySelector('#gfunc .chip.on');
    if(!w) return gate('We need a name so you can be told what happened to it.');
    S.who=w;
    if(!okMail(m)){ S.mail=m; return gate('We need your work email. That is how this gets tracked and how the answer reaches you.'); }
    S.mail=m;
    if(!f) return gate('Pick the part of SIPS you work in.');
    S.fn=f.dataset.fn;
    localStorage.setItem('sbd_who',w); localStorage.setItem('sbd_mail',m);
    localStorage.setItem('sbd_fn',S.fn); render();
  };
}

function formView(){
  el.innerHTML=idbar()+`
  <div class="card">
    <div class="card-t">What did you run into?</div>
    <div class="card-s">Anything at all. Broken, confusing, or just an idea. You do not need to work out whether it is a bug, and nothing you send here changes the platform.</div>
    <div class="known"><b>Already known, no need to report:</b> endoscopy modules are not built yet, scripts cannot be assigned on their own yet, and the Black Belt observation checklist is still empty.</div>
  </div>
  <div class="card">
    <div id="ferr"></div>
    <div class="f"><label class="lbl" for="q1">What happened</label>
      <span class="hint">In your own words. No need to be technical.</span>
      <textarea class="ta" id="q1" placeholder="I tried to..."></textarea></div>
    <div class="f"><label class="lbl">Where in the platform</label>
      <span class="hint">Tap the closest one.</span>
      <div class="row" id="area">${chips(AREAS,1)}</div></div>
    <div class="f"><label class="lbl" for="q2">What you expected instead</label>
      <span class="hint">Optional, but it usually saves a follow up.</span>
      <input class="inp" id="q2" placeholder="I expected the queue to show the two requests"></div>
    <div class="f"><label class="lbl">How much is it in your way</label>
      <span class="hint">Your honest read. Priority gets worked out on our side.</span>
      <div class="row" id="impact">${chips(IMPACTS,0)}</div></div>
    <button class="btn btn-g" id="send">Send it</button>
  </div>`;
  document.getElementById('send').onclick=submit;
}

async function submit(){
  const btn=document.getElementById('send'), errb=document.getElementById('ferr');
  const what=document.getElementById('q1').value.trim();
  errb.innerHTML='';
  if(what.length<10){ errb.innerHTML='<div class="err">Say a little more about what happened.</div>'; return; }
  btn.disabled=true; btn.textContent='Sending...';
  try{
    const ref=await rpc('submit_intake',{
      p_who:S.who,
      p_what:what,
      p_function:S.fn,
      p_expected:document.getElementById('q2').value.trim(),
      p_email:S.mail,
      p_area:document.querySelector('#area .chip.on').textContent,
      p_impact:document.querySelector('#impact .chip.on').textContent
    });
    el.innerHTML=`<div class="card"><div class="ok">
      <div class="ok-i">&#10003;</div>
      <div class="ok-m">Sent. Thank you.</div>
      <div class="ok-s">Logged as ${esc(ref)}. Nothing in the platform changes because of this. It gets checked against what we already know, and you will hear back either way, usually within a day.</div>
      <button class="btn" id="again">Report something else</button>
    </div></div>`;
    document.getElementById('again').onclick=()=>{S.tab='new';render();};
    window.scrollTo(0,0);
  }catch(e){
    errb.innerHTML=`<div class="err">${esc(e.message)}</div>`;
    btn.disabled=false; btn.textContent='Send it';
  }
}

async function mineView(){
  el.innerHTML=idbar()+`<div class="card"><div class="card-t">What you have reported</div>
    <div class="card-s">You hear back on every one. Nothing is ever closed off, it is either done, in progress, or tabled.</div></div>
    <div class="load" id="ml">Loading...</div>`;
  try{
    const items=await rpc('my_intake',{p_who:S.who,p_email:S.mail})||[];
    const box=document.getElementById('ml');
    if(!items.length){ box.outerHTML='<div class="load">Nothing yet. Anything you send will show up here with its outcome.</div>'; return; }
    box.outerHTML=items.map(i=>`<div class="item">
      <div class="item-h"><div class="item-t">${esc(i.what).slice(0,140)}</div><span class="pill p-${esc(i.tone)}">${esc(i.label)}</span></div>
      ${i.answer?`<div class="item-b">${esc(i.answer)}</div>`:''}
      <div class="item-m">${esc(i.ref)} &middot; sent ${new Date(i.submitted).toLocaleDateString()}${i.decided?' &middot; answered '+new Date(i.decided).toLocaleDateString():''}</div>
    </div>`).join('');
  }catch(e){
    document.getElementById('ml').outerHTML=`<div class="err">${esc(e.message)}</div>`;
  }
}

function render(){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.t===S.tab));
  if(!S.who||!okMail(S.mail)||!S.fn) return gate();
  S.tab==='mine'?mineView():formView();
  window.scrollTo(0,0);
}

document.addEventListener('click',e=>{
  const t=e.target.closest('.tab'); if(t){ S.tab=t.dataset.t; return render(); }
  if(e.target.id==='chg'){ S.who=''; return gate(); }
  const c=e.target.closest('.chip');
  if(c){ [...c.parentElement.children].forEach(x=>x.classList.remove('on')); c.classList.add('on'); }
});
render();

/* Speech to text on every text field.
   One button lives at the document level and moves to whichever field has focus.
   Nothing about any form changes, and browsers without the API never see it. */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  function ok(el){
    if(!el) return false;
    if(el.tagName === 'TEXTAREA') return true;
    if(el.tagName !== 'INPUT') return false;
    var t = (el.getAttribute('type') || 'text').toLowerCase();
    return t === 'text' || t === 'search';
  }
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'micb';
  b.setAttribute('aria-label', 'Speak instead of typing');
  b.title = 'Speak instead of typing';
  b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">' +
    '<path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>' +
    '<path fill="currentColor" d="M18 12a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A6 6 0 0 0 18 12z"/>' +
    '</svg>';
  var hint = document.createElement('div');
  hint.className = 'michint'; hint.textContent = 'Listening';
  document.body.appendChild(b); document.body.appendChild(hint);

  var field = null, rec = null, live = false, base = '', at = 0;

  function place(){
    if(!field || !document.body.contains(field)){ hide(); return; }
    var r = field.getBoundingClientRect();
    if(r.width < 90 || r.bottom < 4 || r.top > innerHeight - 4){ hide(); return; }
    var top = field.tagName === 'TEXTAREA' ? r.top + 8 : r.top + (r.height - 26) / 2;
    b.style.left = (r.right - 33) + 'px'; b.style.top = top + 'px';
    b.classList.add('on2');
    hint.style.left = (r.right - 33) + 'px'; hint.style.top = (top - 24) + 'px';
    if(live) hint.classList.add('on2'); else hint.classList.remove('on2');
  }
  function hide(){ b.classList.remove('on2'); hint.classList.remove('on2'); }

  addEventListener('focusin', function(e){ if(ok(e.target)){ field = e.target; place(); } });
  addEventListener('focusout', function(e){
    if(e.target !== field) return;
    setTimeout(function(){
      if(document.activeElement !== field && !live){ hide(); field = null; }
    }, 150);
  });
  addEventListener('scroll', place, true);
  addEventListener('resize', place);

  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){
    if(live){ try{ rec.stop(); }catch(_){} return; }
    if(!field) return;
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    base = field.value;
    at = (typeof field.selectionStart === 'number') ? field.selectionStart : field.value.length;
    rec.onstart = function(){ live = true; b.classList.add('rec'); place(); };
    rec.onerror = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2'); };
    rec.onend   = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2');
                              if(field) try{ field.focus(); }catch(_){} };
    rec.onresult = function(ev){
      var txt = '';
      for(var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      txt = txt.replace(/\s+/g, ' ').trim();
      if(!txt) return;
      var pre = base.slice(0, at), post = base.slice(at);
      var sep = (pre && !/\s$/.test(pre)) ? ' ' : '';
      field.value = pre + sep + txt + post;
      try{ field.setSelectionRange(field.value.length - post.length, field.value.length - post.length); }catch(_){}
      field.dispatchEvent(new Event('input', {bubbles:true}));
      place();
    };
    try{ rec.start(); }catch(_){}
  });
})();
</script>
</body>
</html>
