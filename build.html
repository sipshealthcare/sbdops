<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SBD Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#D49A00;--ink:#070d1f;--card:#0e1328;--line:#1c2646;--lift:#131b3a;
--dim:#94a3b8;--mut:#64748b;--red:#f0616d;--amb:#e0a132;--grn:#3fb984}

/* ── SIMVOLY / BAKND EMBED COLOR LOCK ─────────────────────────── */
@layer host-reset{ #sbd-root, #sbd-root *{ box-sizing:border-box !important; } }
#sbd-root, #sbd-root div,#sbd-root span,#sbd-root p,#sbd-root a,#sbd-root li,
#sbd-root h1,#sbd-root h2,#sbd-root h3,#sbd-root label,#sbd-root td,#sbd-root th,
#sbd-root input,#sbd-root textarea,#sbd-root button{font-family:'Poppins',-apple-system,'Segoe UI',sans-serif !important;}
#sbd-root{background:#070d1f !important;color:#e6ebf5 !important;}
#sbd-root .side,#sbd-root .brand{background:#0a1024 !important;}
#sbd-root .bmark{background:#004789 !important;color:#ffffff !important;}
#sbd-root .bname{color:#ffffff !important;}
#sbd-root .bsub{color:#94a3b8 !important;}
#sbd-root .nav-l{color:#64748b !important;}
#sbd-root .nav-i{color:#94a3b8 !important;background:#0a1024 !important;}
#sbd-root .nav-i:hover{color:#ffffff !important;background:#131b3a !important;}
#sbd-root .nav-i.on{color:#D49A00 !important;background:#131b3a !important;}
#sbd-root .nav-n{color:#e6ebf5 !important;background:#1c2646 !important;}
#sbd-root .main,#sbd-root .top{background:#070d1f !important;}
#sbd-root .top-t{color:#ffffff !important;}
#sbd-root .top-s{color:#94a3b8 !important;}
#sbd-root .burger span{background:#e6ebf5 !important;}
#sbd-root .card{background:#0e1328 !important;border-color:#1c2646 !important;}
#sbd-root .card-t{color:#ffffff !important;}
#sbd-root .card-s{color:#94a3b8 !important;}
#sbd-root .p{color:#cbd5e5 !important;}
#sbd-root .lead{color:#ffffff !important;}
#sbd-root .muted{color:#94a3b8 !important;}
#sbd-root .sec{color:#D49A00 !important;}
#sbd-root .note{color:#94a3b8 !important;background:#131b3a !important;}
#sbd-root .pill{color:#e6ebf5 !important;}
#sbd-root .p-red{background:rgba(240,97,109,.14) !important;color:#f0616d !important;}
#sbd-root .p-amb{background:rgba(224,161,50,.14) !important;color:#e0a132 !important;}
#sbd-root .p-grn{background:rgba(63,185,132,.14) !important;color:#3fb984 !important;}
#sbd-root .p-gry{background:rgba(100,116,139,.18) !important;color:#94a3b8 !important;}
#sbd-root .item{background:#0e1328 !important;border-color:#1c2646 !important;}
#sbd-root .item-t{color:#ffffff !important;}
#sbd-root .item-m{color:#64748b !important;}
#sbd-root .item-b{color:#cbd5e5 !important;}
#sbd-root .due{color:#ffffff !important;background:#131b3a !important;}
#sbd-root .due-d{color:#e0a132 !important;}
#sbd-root .tbl th{color:#94a3b8 !important;background:#131b3a !important;}
#sbd-root .tbl td{color:#cbd5e5 !important;}
#sbd-root .btn{background:#1c2646 !important;color:#e6ebf5 !important;}
#sbd-root .btn-g{background:#D49A00 !important;color:#000000 !important;}
#sbd-root .btn-o{background:#1c2646 !important;color:#94a3b8 !important;}
#sbd-root .lbl{color:#ffffff !important;}
#sbd-root .hint{color:#64748b !important;}
#sbd-root .ta{background:#070d1f !important;color:#e6ebf5 !important;border-color:#1c2646 !important;}
#sbd-root .ta::placeholder{color:#64748b !important;}
#sbd-root .inp{background:#070d1f !important;color:#e6ebf5 !important;border-color:#1c2646 !important;}
#sbd-root .inp::placeholder{color:#64748b !important;}
#sbd-root .st{background:#131b3a !important;color:#94a3b8 !important;border-color:#1c2646 !important;}
#sbd-root .st.on{background:#3fb984 !important;color:#000000 !important;border-color:#3fb984 !important;}
#sbd-root .toast{background:#D49A00 !important;color:#000000 !important;}
#sbd-root .clamp:not(.open)::after{background:linear-gradient(to bottom,rgba(14,19,40,0) 0%,#0e1328 92%) !important;}
#sbd-root .morebar .rule{background:#1c2646 !important;}
/* ── END LOCK ──────────────────────────────────────────────────── */

*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s}
.side.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.bmark{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 30px}
.bname{font-weight:600;font-size:14px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.nav{padding:2px 10px 16px;overflow-y:auto;flex:1}
.nav-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;padding:10px 8px 6px}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 11px;border:0;border-radius:8px;font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-n{font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;min-width:21px;text-align:center}
.main{flex:1;min-width:0;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 18px}
.burger{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;display:grid;place-content:center;gap:4px;cursor:pointer;flex:0 0 36px}
.burger span{width:15px;height:2px;border-radius:2px;display:block}
.top-t{font-size:20px;font-weight:600;line-height:1.2}
.top-s{font-size:12.5px;margin-top:1px}
.view{display:none}.view.on{display:block}
.max{max-width:760px}
.card{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:13px}
.card-h{margin-bottom:14px}
.card-t{font-size:15.5px;font-weight:600}
.card-s{font-size:12.5px;margin-top:2px}
.p{font-size:13.5px;margin-bottom:10px}
.p:last-child{margin-bottom:0}
.lead{font-weight:600}
.muted{font-size:12.5px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;margin:20px 0 9px}
.sec:first-child{margin-top:0}
.note{font-size:12.5px;border-radius:10px;padding:12px 14px;border-left:3px solid var(--gold);margin-bottom:16px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:5px}
.item-t{font-size:14px;font-weight:600;line-height:1.4}
.item-m{font-size:11px;margin-top:7px}
.item-b{font-size:13px;margin-top:6px}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.due-d{font-size:12px;font-weight:600;letter-spacing:.03em}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.tbl thead,.tbl tbody,.tbl tr{display:table;width:100%;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:9px 11px}
.tbl td{padding:10px 11px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.tbl th:first-child,.tbl td:first-child{width:66px;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.hint{display:block;font-size:12px;margin-bottom:9px}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5;min-height:90px;resize:vertical}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5}
.ta:focus,.inp:focus{outline:2px solid var(--gold);outline-offset:-1px}
.st{border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.f{margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}
.scrim.on{display:block}
@media(min-width:900px){
  .side{position:sticky;height:100vh;transform:none}
  .scrim,.burger{display:none!important}
  .main{padding:22px 30px 60px}
  .top-t{font-size:23px}
}
.clamp{position:relative;overflow:hidden;max-height:280px}
.clamp.open{max-height:none}
.clamp:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:76px;
  background:linear-gradient(to bottom,rgba(14,19,40,0) 0%,#0e1328 92%);pointer-events:none}
.morebar{display:flex;align-items:center;gap:10px;margin-top:12px}
.morebar .rule{flex:1;height:1px;background:var(--line)}
</style>
</head>
<body>
<div id="sbd-root">
<div class="wrap">
  <aside class="side" id="side">
    <div class="brand"><div class="bmark">DEV</div>
      <div><div class="bname">SBD Build</div><div class="bsub">Dev team</div></div></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
      <div><div class="top-t" id="ttl">Today</div><div class="top-s" id="sub">Thursday, August 13, 2026</div></div>
      <button class="btn" id="refresh" style="margin-left:auto" hidden>Refresh</button>
    </div>
    <div id="views"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
/* Backend: Supabase project SBD OPS. Same hand-rolled rpc() pattern as
   index.html: fetch only, no SDK, no build step. Every call here requires a
   signed-in user whose app_users row says dev; the database enforces it, not
   this page. A dev never receives untriaged intake — that filter is a row
   level security policy, not a page filter. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

const esc=t=>String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const fmtD=d=>d?new Date(d+(String(d).length===10?'T12:00:00':'')).toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const ageDays=d=>Math.max(0,Math.floor((Date.now()-new Date(d).getTime())/86400000));
const agePill=n=>P(n>=30?'p-red':n>=10?'p-amb':'p-gry',`${n} day${n===1?'':'s'}`);
const stPill=s=>({'shipped':P('p-grn','Shipped'),'in-progress':P('p-amb','In progress'),'blocked':P('p-red','Blocked'),'backlog':P('p-gry','Backlog'),'open':P('p-gry','Open')}[s]||P('p-gry',esc(s)));
const today=()=>new Date().toISOString().slice(0,10);

const hdrs=()=>({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`});
async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:hdrs(),body:JSON.stringify(args||{})});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Something went wrong on our side.');
  return d;
}
async function q(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:hdrs()});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Could not load data.');
  return d||[];
}
function md(src){
  if(!src) return '';
  const lines=String(src).split(/\r?\n/); let out='',list=false;
  const inline=s=>esc(s).replace(/\*\*([^*]+)\*\*/g,'<span class="lead">$1</span>');
  for(const ln of lines){
    const l=ln.trim();
    if(/^[-*] /.test(l)){ if(!list){out+='<div class="p">';list=true;} out+=`&bull; ${inline(l.slice(2))}<br>`; continue; }
    if(list){out+='</div>';list=false;}
    if(!l) continue;
    if(/^#{1,3} /.test(l)) out+=`<div class="sec">${inline(l.replace(/^#+ /,''))}</div>`;
    else out+=`<div class="p">${inline(l)}</div>`;
  }
  if(list) out+='</div>';
  return out;
}

/* ---------- state ---------- */
const D={board:[],intake:[],decisions:[],releases:[],refdocs:[],briefs:[],eods:[],addenda:[]};
const WHO_KEY='sbd_dev_who';
const sprintNow=()=>{const c=[...D.board].filter(t=>t.sprint&&t.status!=='shipped').sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));return c.length?c[0].sprint:null;};

async function loadAll(){
  rpc('snapshot_tracker').catch(()=>{});
  const [board,intake,decisions,releases,refdocs,briefs,eods,addenda]=await Promise.all([
    q('tracker_items?select=number,title,status,priority,sprint,source,intake_ref,shipped_on,review_on,rank,created_at,updated_at&order=number.asc'),
    q('intake?select=ref,who,area,impact,what,status,verdict,analysis,decided_at&order=decided_at.desc'),
    q('decisions?select=ref,question,blocks,raised_on,status,answer,reasoning,answered_on,review_on&order=raised_on.asc'),
    q('releases?select=released_on,outcome,summary,detail,verification,item_numbers&order=released_on.desc&limit=20'),
    q('reference_docs?select=slug,title,body'),
    q('briefs?select=brief_date,author,body&order=brief_date.desc&limit=1'),
    q('eod_reports?select=report_date,author,completed,qa,still_working,needs_ignacio&order=report_date.desc&limit=14'),
    q('eod_addenda?select=addendum_date,author,author_role,body,created_at&order=created_at.desc&limit=30')
  ]);
  Object.assign(D,{board,intake,decisions,releases,refdocs,briefs,eods,addenda});
}

/* ---------- views ---------- */
function todayHTML(){
  const brief=D.briefs[0];
  const ranked=D.board.filter(t=>t.rank!=null&&t.status!=='shipped').sort((a,b)=>a.rank-b.rank||a.number-b.number);
  const open=D.decisions.filter(d=>d.status==='open').sort((a,b)=>new Date(a.raised_on)-new Date(b.raised_on));
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">This morning's brief</div>
  <div class="card-s">${brief?`From ${esc(brief.author)} &middot; ${fmtD(brief.brief_date)}`:'Nothing received yet'}</div></div>
  ${brief?briefBlock(brief.body):'<div class="p muted">No brief has been sent yet. When Ignacio posts one it appears here on refresh, dated, with priorities in order.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Priority order</div>
  <div class="card-s">Set on the master board. Rank 1 means do this first. Hit Refresh to pick up changes.</div></div>
  ${ranked.length?ranked.map(t=>`
  <div class="due"><div>${t.rank}. &nbsp;#${t.number} &middot; ${esc(t.title)}<div class="due-d">${[t.sprint?esc(t.sprint):'',esc(t.priority)].filter(Boolean).join(' &middot; ')}</div></div>
  <div class="row">${stPill(t.status)}</div></div>`).join('')
  :'<div class="p muted">Nothing is ranked right now. When Ignacio sets an order it shows here, numbered.</div>'}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Waiting on Ignacio</div><div class="card-s">Your questions, and how long they have been open</div></div>
  ${open.length?open.map(d=>`
  <div class="item"><div class="item-h"><div class="item-t">${esc(d.question)}</div>${agePill(ageDays(d.raised_on))}</div>
  <div class="item-m">Raised ${fmtD(d.raised_on)}${d.blocks?' &middot; blocks: '+esc(d.blocks):''}</div></div>`).join('')
  :'<div class="p muted">Nothing waiting. Questions you raise under Ask land here with their age.</div>'}
  <div class="row" style="margin-top:4px"><button class="btn btn-g" data-go="ask">Ask something new</button></div>
</div>`;
}

function sprintHTML(){
  const sp=sprintNow();
  const spRows=D.board.filter(t=>sp&&t.sprint===sp).sort((a,b)=>(a.rank??999)-(b.rank??999)||a.number-b.number);
  const rest=D.board.filter(t=>!sp||t.sprint!==sp).sort((a,b)=>a.number-b.number);
  const appr=D.intake.filter(i=>i.status==='approved'||i.status==='shipped');
  const trackerOf=r=>D.board.find(t=>t.intake_ref===r);
  const stOpts=s=>['open','in-progress','shipped','blocked','backlog'].map(x=>`<option${x===s?' selected':''}>${x}</option>`).join('');
  const row=t=>`<tr><td>${t.number}</td>
  <td>${t.rank!=null?`<span class="due-d">${t.rank}.</span> `:''}${esc(t.title)}<div class="age">${[t.sprint?esc(t.sprint):'',t.intake_ref?'from '+esc(t.intake_ref):'',t.shipped_on?'shipped '+fmtD(t.shipped_on):'',t.review_on?'review '+fmtD(t.review_on):''].filter(Boolean).join(' &middot; ')||'&nbsp;'}</div></td>
  <td><div class="row" style="gap:5px">
    <select class="ta" id="st-${t.number}" style="min-height:0;width:118px;padding:8px 9px;font-size:12px">${stOpts(t.status)}</select>
    <input class="inp" id="dt-${t.number}" type="date" style="width:132px;padding:8px 9px;font-size:12px">
    <button class="btn" data-upd="${t.number}">Apply</button>
  </div></td></tr>`;
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">${sp?`Committed &middot; ${esc(sp)}`:'Committed'}</div>
  <div class="card-s">${spRows.length?`${spRows.length} items. Status changes write straight to the record.`:'No items carry a sprint tag right now.'}</div></div>
  ${spRows.length?`<table class="tbl"><thead><tr><th>#</th><th>Item</th><th>Change</th></tr></thead><tbody>${spRows.map(row).join('')}</tbody></table>`:''}
  <div class="p muted" style="margin-top:10px">Shipped needs a ship date, backlog a review date; use the date box. Titles and priorities are read only from this side.</div>
</div>
${rest.length?`
<div class="card max">
  <div class="card-h"><div class="card-t">Everything else on the ledger</div></div>
  <table class="tbl"><thead><tr><th>#</th><th>Item</th><th>Change</th></tr></thead><tbody>${rest.map(row).join('')}</tbody></table>
</div>`:''}
<div class="card max">
  <div class="card-h"><div class="card-t">Approved from intake</div><div class="card-s">Came from the SIPS admin team, triaged and approved. Untriaged intake never reaches this page.</div></div>
  ${appr.length?appr.map(i=>{const t=trackerOf(i.ref);return `
  <div class="item"><div class="item-h"><div class="item-t">${esc(i.what).slice(0,120)}</div>${i.impact?P(i.impact==='Blocking me now'?'p-red':i.impact==='Slowing me down'?'p-amb':'p-gry',esc(i.impact)):''}</div>
  ${i.verdict?`<div class="item-b">${esc(i.verdict)}${i.analysis?' &mdash; '+esc(i.analysis):''}</div>`:''}
  <div class="item-m">${esc(i.ref)}${t?` &rarr; tracker #${t.number}`:''}${i.decided_at?' &middot; approved '+fmtD(i.decided_at):''}</div></div>`;}).join('')
  :'<div class="p muted">Nothing approved yet. When intake is triaged and approved on the master board it appears here.</div>'}
</div>`;
}

function eodHTML(){
  const who=localStorage.getItem(WHO_KEY)||'';
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">End of day, ${new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'})}</div>
  <div class="card-s">Same four sections as always. One ask: name the tracker number on anything you mark shipped.</div></div>
  <div class="f"><label class="lbl">Your name</label>
    <input class="inp" id="eodWho" value="${esc(who)}" placeholder="Who is posting this"></div>
  <div class="f"><label class="lbl">Completed today</label>
    <span class="hint">What shipped, with the tracker number and how to check it.</span>
    <textarea class="ta" id="eodDone" placeholder="#104 Tracker reconciled and republished. To check: open the board, rows 26 and 27 now read Shipped."></textarea></div>
  <div class="f"><label class="lbl">QA and verification run today</label>
    <span class="hint">What you checked against the live system rather than against the report of it.</span>
    <textarea class="ta" id="eodQa"></textarea></div>
  <div class="f"><label class="lbl">Still working</label>
    <span class="hint">One per line, with an expected date on each.</span>
    <textarea class="ta" id="eodStill"></textarea></div>
  <div class="f"><label class="lbl">Needs Ignacio</label>
    <span class="hint">Anything blocked on a decision. These become tracked questions with a date on them.</span>
    <textarea class="ta" id="eodNeeds"></textarea></div>
  <button class="btn btn-g" data-act="postEod">Post EOD</button>
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Forgot to mention</div>
  <div class="card-s">Left something out of an EOD? Push it through here. It lands dated on both boards.</div></div>
  <div class="f"><textarea class="ta" id="addBody" style="min-height:64px" placeholder="One thing, in plain words."></textarea></div>
  <div class="row" style="margin-bottom:14px"><button class="btn btn-g" data-act="addendum">Push it through</button></div>
  ${D.addenda.length?D.addenda.slice(0,8).map(a=>`
  <div class="item"><div class="item-b" style="margin-top:0">${esc(a.body)}</div>
  <div class="item-m">${fmtD(a.addendum_date)} &middot; ${esc(a.author)} &middot; ${a.author_role==='master_admin'?'master admin':'dev team'}</div></div>`).join(''):''}
</div>

<div class="card max">
  <div class="card-h"><div class="card-t">Recent reports</div></div>
  ${D.eods.length?D.eods.map(r=>`
  <div class="item"><div class="item-h"><div class="item-t">${fmtD(r.report_date)}${r.author?' &middot; '+esc(r.author):''}</div></div>
  ${r.completed?`<div class="item-b">${esc(r.completed).slice(0,240)}</div>`:''}
  ${r.needs_ignacio?`<div class="item-m">Needs Ignacio: ${esc(r.needs_ignacio).slice(0,140)}</div>`:''}</div>`).join('')
  :'<div class="p muted">No EOD reports in the record yet. The first one posted above starts the history.</div>'}
</div>`;
}

function askHTML(){
  const open=D.decisions.filter(d=>d.status==='open').sort((a,b)=>new Date(a.raised_on)-new Date(b.raised_on));
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Ask a question</div>
  <div class="card-s">This becomes a tracked item with a date on it, rather than a paragraph in tonight's EOD that ages quietly.</div></div>
  <div class="f"><label class="lbl">What do you need decided</label>
    <textarea class="ta" id="askQ" placeholder="For endoscopy, how many modules and do the gates follow the Foundations three-pass rule?"></textarea></div>
  <div class="f"><label class="lbl">What it blocks</label>
    <span class="hint">So it can be prioritised honestly against everything else.</span>
    <textarea class="ta" id="askB" style="min-height:60px" placeholder="The endoscopy build cannot start without it."></textarea></div>
  <button class="btn btn-g" data-act="ask">Send</button>
</div>
<div class="card max">
  <div class="card-h"><div class="card-t">Open</div><div class="card-s">Everything this team is waiting on</div></div>
  ${open.length?open.map(d=>`
  <div class="item"><div class="item-h"><div class="item-t">${esc(d.question)}</div>${agePill(ageDays(d.raised_on))}</div>
  <div class="item-m">${esc(d.ref)} &middot; raised ${fmtD(d.raised_on)}${d.blocks?' &middot; blocks: '+esc(d.blocks):''}</div></div>`).join('')
  :'<div class="p muted">Nothing open.</div>'}
</div>`;
}

function releasesHTML(){
  const byNum=Object.fromEntries(D.board.map(b=>[b.number,b.title]));
  return `
<div class="card max">
  <div class="card-h"><div class="card-t">Post a release</div>
  <div class="card-s">Merged, deployed and confirmed are three separate facts. Verification records the third.</div></div>
  <div class="f"><label class="lbl">What went out</label>
    <input class="inp" id="relSum" placeholder="One line. What changed."></div>
  <div class="f"><label class="lbl">Tracker numbers</label>
    <span class="hint">Comma separated. Numbers with no tracker row are kept and flagged, not dropped.</span>
    <input class="inp" id="relNums" placeholder="104, 87"></div>
  <div class="f"><label class="lbl">Detail</label>
    <textarea class="ta" id="relDet" style="min-height:60px"></textarea></div>
  <div class="f"><label class="lbl">How it was verified</label>
    <span class="hint">Against the live system, not against the report of it.</span>
    <input class="inp" id="relVer" placeholder="Checked the board: rows 26 and 27 read Shipped."></div>
  <div class="row">
    <select class="ta" id="relOut" style="min-height:0;width:150px;padding:9px 10px"><option value="live">live</option><option value="rolled-back">rolled-back</option></select>
    <button class="btn btn-g" data-act="postRelease">Log it</button>
  </div>
</div>
<div class="card max">
  <div class="card-h"><div class="card-t">Recent</div></div>
  ${D.releases.length?D.releases.map(r=>`
  <div class="item"><div class="item-h"><div class="item-t">${fmtD(r.released_on)} &middot; ${esc(r.summary)}</div>${r.outcome==='live'?P('p-grn','Live'):P('p-red','Rolled back')}</div>
  ${r.detail?`<div class="item-b">${esc(r.detail)}</div>`:''}
  <div class="item-m">${[r.verification?'Verified: '+esc(r.verification):'',(r.item_numbers||[]).length?(r.item_numbers||[]).map(n=>byNum[n]?`#${n}`:`#${n} (no row)`).join(', '):''].filter(Boolean).join(' &middot; ')||'No verification recorded'}</div></div>`).join('')
  :'<div class="p muted">No releases in the record yet. The first one logged above starts the history.</div>'}
</div>`;
}

function checksHTML(){
  const order=['standards','severity','capability','limitations','glossary','surfaces'];
  const want=D.refdocs.filter(r=>['standards','severity'].includes(r.slug));
  const docs=(want.length?want:D.refdocs).sort((a,b)=>order.indexOf(a.slug)-order.indexOf(b.slug));
  if(!docs.length) return '<div class="card max"><div class="card-h"><div class="card-t">Standards</div></div><div class="p muted">No reference documents in the database yet. Standards and severity render here once loaded.</div></div>';
  return docs.map(r=>`<div class="card max"><div class="card-h"><div class="card-t">${esc(r.title)}</div></div>${md(r.body)||'<div class="p muted">Empty.</div>'}</div>`).join('');
}


/* The brief runs to thousands of words. Show the opening, let it be opened. */
let briefOpen=false;
function briefBlock(body){
  if(!body) return '';
  const short = body.length < 700;
  if(short) return md(body);
  return `<div class="clamp${briefOpen?' open':''}">${md(body)}</div>
  <div class="morebar"><div class="rule"></div>
    <button class="btn" data-brief="1">${briefOpen?'See less':'See more'}</button>
    <div class="rule"></div></div>`;
}

/* ---------- registry, nav, draw ---------- */
const V={
  today:{n:'Today',s:new Date().toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}),h:todayHTML},
  sprint:{n:'Sprint',s:'Committed work and where it stands',b:()=>{const sp=sprintNow();return D.board.filter(t=>sp&&t.sprint===sp&&t.status!=='shipped').length;},h:sprintHTML},
  eod:{n:'Post EOD',s:'End of day report',h:eodHTML},
  ask:{n:'Ask',s:'Questions to Ignacio',b:()=>D.decisions.filter(d=>d.status==='open').length,h:askHTML},
  releases:{n:'Releases',s:'What is live',h:releasesHTML},
  checks:{n:'Standards',s:'Check before you ship',h:checksHTML}
};
const KEYS=['today','sprint','eod','ask','releases','checks'];
const nav=document.getElementById('nav'),views=document.getElementById('views');
const side=document.getElementById('side'),scrim=document.getElementById('scrim'),toast=document.getElementById('toast');
const refreshBtn=document.getElementById('refresh');
let cur='today';

function draw(){
  nav.innerHTML='<div class="nav-l">Build</div>'+KEYS.map(k=>{
    const b=V[k].b?V[k].b():0;
    return `<button class="nav-i${k===cur?' on':''}" data-k="${k}"><span>${V[k].n}</span>${b?`<span class="nav-n">${b}</span>`:''}</button>`;}).join('');
  views.innerHTML=`<div class="view on">${V[cur].h()}</div>`;
  document.getElementById('ttl').textContent=V[cur].n;
  document.getElementById('sub').innerHTML=V[cur].s;
  window.scrollTo(0,0);
}
function go(k){cur=k;draw();shut();}
function shut(){side.classList.remove('open');scrim.classList.remove('on');}
function say(m){toast.textContent=m;toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),2600);}

/* ---------- auth ---------- */


async function boot(){
  try{
    views.innerHTML='<div class="view on"><div class="p muted">Loading the record...</div></div>';
    await loadAll();
    refreshBtn.hidden=false;
    draw();
  }catch(e){
    views.innerHTML=`<div class="view on"><div class="card max"><div class="card-t">Could not load</div><div class="p" style="margin-top:8px">${esc(e.message)}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="location.reload()">Try again</button></div></div></div>`;
  }
}

async function refresh(quiet){
  try{ await loadAll(); draw(); if(!quiet) say('Refreshed. This is the record as of right now.'); }
  catch(e){ say(e.message); }
}
async function act(fn){
  try{ await fn(); await refresh(true); }
  catch(e){ say(e.message); }
}
const val=id=>{const n=document.getElementById(id);return n?n.value.trim():'';};

document.addEventListener('click',e=>{
  const n=e.target.closest('[data-k]'); if(n) return go(n.dataset.k);
  const g=e.target.closest('[data-go]'); if(g) return go(g.dataset.go);
  if(e.target===refreshBtn) return refresh();
  if(e.target.closest('[data-brief]')){ briefOpen=!briefOpen; return draw(); }

  const up=e.target.closest('[data-upd]');
  if(up){ const num=Number(up.dataset.upd);
    return act(async()=>{ const st=val('st-'+num), dt=val('dt-'+num)||null;
      await rpc('update_tracker',{p_number:num,p_status:st,
        p_shipped_on:st==='shipped'?(dt||today()):null,
        p_review_on:st==='backlog'?dt:null});
      say(`#${num} is now ${st}. Ignacio sees it on his board.`); }); }

  const a=e.target.closest('[data-act]');
  if(!a) return;
  if(a.dataset.act==='postEod') return act(async()=>{
    const who=val('eodWho'); if(who) localStorage.setItem(WHO_KEY,who);
    const still=val('eodStill')?val('eodStill').split(/\n+/).map(s=>s.trim()).filter(Boolean):[];
    await rpc('post_eod',{p_date:today(),p_author:who||'Dev team',p_completed:val('eodDone')||null,
      p_qa:val('eodQa')||null,p_still_working:still,p_needs_ignacio:val('eodNeeds')||null});
    say("Posted. It is in the record and on Ignacio's board."); });
  if(a.dataset.act==='addendum') return act(async()=>{
    await rpc('post_addendum',{p_body:val('addBody'),p_author:localStorage.getItem(WHO_KEY)||'Dev team'});
    say('Pushed through, with a date on it.'); });
  if(a.dataset.act==='ask') return act(async()=>{
    const ref=await rpc('raise_question',{p_question:val('askQ'),p_blocks:val('askB')||null});
    say(`Sent as ${ref}. It now has a date on it.`); });
  if(a.dataset.act==='postRelease') return act(async()=>{
    const nums=val('relNums')?val('relNums').split(/[,\s]+/).map(Number).filter(n=>Number.isInteger(n)&&n>0):[];
    const res=await rpc('post_release',{p_date:today(),p_outcome:val('relOut')||'live',p_summary:val('relSum'),
      p_detail:val('relDet')||null,p_verification:val('relVer')||null,p_item_numbers:nums});
    const un=(res&&res.unlinked)||[];
    say(un.length?`Logged. Note: no tracker row for ${un.map(n=>'#'+n).join(', ')} — kept anyway.`:'Logged. Every number matched a tracker row.'); });
});
document.getElementById('burger').onclick=()=>{side.classList.add('open');scrim.classList.add('on');};
scrim.onclick=shut;
boot();
</script>
</body>
</html>
