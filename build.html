*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s}
.side.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.bmark{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 30px}
.bname{font-weight:600;font-size:14px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.nav{padding:2px 10px 16px;overflow-y:auto;flex:1}
.nav-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;padding:10px 8px 6px}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 11px;border:0;border-radius:8px;font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-n{font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;min-width:21px;text-align:center}
.main{flex:1;min-width:0;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 18px}
.burger{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;display:grid;place-content:center;gap:4px;cursor:pointer;flex:0 0 36px}
.burger span{width:15px;height:2px;border-radius:2px;display:block}
.top-t{font-size:20px;font-weight:600;line-height:1.2}
.top-s{font-size:12.5px;margin-top:1px}
.view{display:none}.view.on{display:block}
.max{max-width:760px}
.card{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:13px}
.card-h{margin-bottom:14px}
.card-t{font-size:15.5px;font-weight:600}
.card-s{font-size:12.5px;margin-top:2px}
.p{font-size:13.5px;margin-bottom:10px}
.p:last-child{margin-bottom:0}
.lead{font-weight:600}
.muted{font-size:12.5px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;margin:20px 0 9px}
.sec:first-child{margin-top:0}
.note{font-size:12.5px;border-radius:10px;padding:12px 14px;border-left:3px solid var(--gold);margin-bottom:16px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:5px}
.item-t{font-size:14px;font-weight:600;line-height:1.4}
.item-m{font-size:11px;margin-top:7px}
.item-b{font-size:13px;margin-top:6px}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.due-d{font-size:12px;font-weight:600;letter-spacing:.03em}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.tbl thead,.tbl tbody,.tbl tr{display:table;width:100%;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:9px 11px}
.tbl td{padding:10px 11px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.tbl th:first-child,.tbl td:first-child{width:66px;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.hint{display:block;font-size:12px;margin-bottom:9px}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5;min-height:90px;resize:vertical}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5}
.ta:focus,.inp:focus{outline:2px solid var(--gold);outline-offset:-1px}
.st{border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.f{margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}
.scrim.on{display:block}
@media(min-width:900px){
  .side{position:sticky;height:100vh;transform:none}
  .scrim,.burger{display:none!important}
  .main{padding:22px 30px 60px}
  .top-t{font-size:23px}
}
.clamp{position:relative;overflow:hidden;max-height:280px}
.clamp.open{max-height:none}
.clamp:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:76px;
  background:linear-gradient(to bottom,rgba(14,19,40,0) 0%,#0e1328 92%);pointer-events:none}
.morebar{display:flex;align-items:center;gap:10px;margin-top:12px}
.morebar .rule{flex:1;height:1px;background:var(--line)}

/* daily brief typography */
.bh1{font-size:17px;font-weight:600;color:#fff;margin:22px 0 8px;letter-spacing:-.01em}
.bh2{font-size:13px;font-weight:600;color:var(--gold);margin:26px 0 10px;
  letter-spacing:.08em;text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--line)}
.bh3{font-size:14.5px;font-weight:600;color:#fff;margin:19px 0 7px}
.bh2:first-child,.bh1:first-child,.bh3:first-child{margin-top:0}
.bp{font-size:13.5px;line-height:1.68;color:#cbd5e5;margin:0 0 12px;max-width:68ch}
.bl{margin:0 0 13px;padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:7px}
.bl li{font-size:13.5px;line-height:1.6;color:#cbd5e5;padding-left:17px;position:relative;max-width:66ch}
.bl li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--gold);opacity:.75}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;margin:0 0 18px;
  padding:14px 16px;background:var(--lift);border-radius:10px;border-left:3px solid var(--gold)}
.meta dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);
  font-weight:600;padding-top:2px;white-space:nowrap}
.meta dd{font-size:13px;color:#e6ebf5;margin:0}
.tblwrap{overflow-x:auto;margin:0 0 16px}
.btbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.btbl th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;color:var(--dim);background:var(--lift);padding:9px 12px;white-space:nowrap}
.btbl th:first-child{border-radius:8px 0 0 0} .btbl th:last-child{border-radius:0 8px 0 0}
.btbl td{padding:10px 12px;border-top:1px solid var(--line);color:#cbd5e5;vertical-align:top;line-height:1.5}
.btbl tbody tr:hover td{background:rgba(212,154,0,.045)}
.bp b,.bl b,.btbl b{color:#fff;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--gold)}

.check{margin-top:7px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.proof{margin-top:7px;font-size:11.5px;line-height:1.5;color:#cbd5e5;
  border-left:2px solid var(--grn);padding:3px 0 3px 9px}
.proof-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grn);font-weight:600;margin-bottom:2px}

.wrap{display:block}
.main{max-width:860px;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.stat-v{font-size:23px;font-weight:700;line-height:1.1;color:#fff}
.stat-v.amb{color:var(--amb)} .stat-v.red{color:var(--red)}
.stat-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px;color:var(--dim)}
.qi{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px;background:var(--card)}
.qi.top{border-left:3px solid var(--gold)}
.qi-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qi-t{font-size:14px;font-weight:600;line-height:1.4;color:#fff}
.qi-p{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;
  background:var(--gold);color:#000;font-size:11px;font-weight:700;margin-right:7px;vertical-align:1px}
.qi-m{font-size:11px;color:var(--mut);margin-top:6px}
.qi-b{font-size:12.5px;color:#cbd5e5;margin-top:8px;line-height:1.55}
.check{margin-top:9px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.ask{margin-top:11px;padding:11px 12px;border-radius:9px;background:var(--lift)}
.ask-h{font-size:12px;color:#cbd5e5;margin-bottom:9px}
.ask-h b{color:#fff}
.ask .dt{width:148px;padding:8px 9px;font-size:12px}
.ask .why{flex:1;min-width:170px;padding:8px 9px;font-size:12px}
.agreed{margin-top:10px;font-size:12px;color:#cbd5e5;border-left:2px solid var(--grn);
  padding:3px 0 3px 9px}
.agreed.ct{border-color:var(--amb)}
.ag-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grn);font-weight:600;margin-bottom:2px}
.agreed.ct .ag-l{color:var(--amb)}
.agreed .by{color:var(--mut)}
@media(max-width:700px){.grid3{grid-template-columns:1fr}.ask .why{min-width:100%}}

/* ── queue layout, warm-bloom variant ───────────────────────────── */
body{background:#070d1f}
#sbd-root{position:relative;overflow-x:hidden}
#sbd-root:before{content:'';position:fixed;top:-220px;right:-180px;width:760px;height:620px;
  background:radial-gradient(closest-side,rgba(212,154,0,.30),rgba(212,154,0,.10) 55%,transparent 78%);
  filter:blur(18px);pointer-events:none;z-index:0}
.main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 14px}

.hero{padding:8px 2px 22px}
.hero-d{font-size:12px;color:var(--dim);letter-spacing:.02em}
.hero-t{font-size:31px;font-weight:600;line-height:1.12;margin-top:7px;color:#fff;letter-spacing:-.02em}
.hero-s{font-size:16px;color:var(--dim);margin-top:5px;font-weight:400}
.hero-a{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.hero-a .btn{padding:11px 20px;font-size:13.5px;border-radius:11px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:15px}
.stat{border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:var(--card)}
.stat-v{font-size:26px;font-weight:700;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.stat-v.amb{color:var(--amb)} .stat-v.red{color:var(--red)}
.stat-l{font-size:11px;letter-spacing:.03em;margin-top:7px;color:var(--dim)}

.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:15px;align-items:start}
.col{display:flex;flex-direction:column;gap:15px;min-width:0}
.card{border:1px solid var(--line);border-radius:17px;padding:18px;margin:0;background:var(--card)}
.card-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:15px}
.ic{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;
  background:var(--lift);color:var(--dim);font-size:15px;line-height:1}
.ic.warm{background:linear-gradient(140deg,#D49A00,#8a6400);color:#000}

.qi{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;background:var(--lift);min-width:0;overflow-wrap:anywhere}
.qi:last-child{margin-bottom:0}
.qi.ranked{border-color:rgba(212,154,0,.42)}
.qi-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qi-t{font-size:13.5px;font-weight:600;line-height:1.42;color:#fff;min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.qi-p{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto}
.rk{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;
  background:var(--gold);color:#000;font-size:10.5px;font-weight:700;margin-right:7px;vertical-align:1px}
.qi-m{font-size:11px;color:var(--mut);margin-top:6px}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);margin-right:7px}
.qi-b{font-size:12.5px;color:#cbd5e5;margin-top:8px;line-height:1.55}
.p-blu{background:rgba(120,150,235,.15);color:#93a9ee}

.check{margin-top:9px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.ask{margin-top:11px;padding:11px 12px;border-radius:10px;background:#0b1226;border:1px solid var(--line)}
.ask-h{font-size:12px;color:#cbd5e5;margin-bottom:9px;line-height:1.5}
.ask-h b{color:#fff}
.ask .dt{flex:0 0 146px;padding:8px 9px;font-size:12px}
.ask .why{flex:1 1 220px;min-width:0;padding:8px 9px;font-size:12px}
.agreed{margin-top:10px;font-size:12px;color:#cbd5e5;border-left:2px solid var(--grn);padding:3px 0 3px 9px}
.agreed.ct{border-color:var(--amb)}
.ag-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grn);font-weight:600;margin-bottom:2px}
.agreed.ct .ag-l{color:var(--amb)}
.agreed .by{color:var(--mut)}

.goal{margin-bottom:15px}.goal:last-child{margin-bottom:0}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#cbd5e5}
.goal-h b{color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}
.bar .g{background:var(--grn)} .bar .a{background:var(--gold)} .bar .r{background:var(--red)}
.goal-m{font-size:11px;color:var(--mut);margin-top:5px}

@media(max-width:1000px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.stats{grid-template-columns:1fr}.hero-t{font-size:25px}.ask .why{min-width:100%}}

@media(max-width:860px){
  .main{padding:16px 13px 50px}
  .cols{grid-template-columns:1fr;gap:13px}
  .card{padding:15px;border-radius:15px}
  .qi-h{flex-direction:column;align-items:stretch;gap:7px}
  .qi-p{order:2}
  .ask .row{flex-direction:column;align-items:stretch;gap:8px}
  .ask .dt,.ask .why,.ask .btn{width:100%;flex:1 1 auto}
  .hero-a .btn{flex:1 1 auto;text-align:center}
}
@media(max-width:560px){
  .hero-t{font-size:23px}
  .hero-s{font-size:14.5px}
  .stats{grid-template-columns:1fr 1fr;gap:9px}
  .stat{padding:13px}
  .stat-v{font-size:22px}
  .card-h{gap:9px}
  .ic{width:30px;height:30px;flex:0 0 30px;border-radius:9px;font-size:13px}
  .tblwrap,.btbl{font-size:11.5px}
  .meta{grid-template-columns:1fr;gap:2px 0;padding:12px 13px}
  .meta dt{padding-top:7px}
}
@media(max-width:380px){ .stats{grid-template-columns:1fr} }

/* the answer panel is the primary action: give it air */
#dates .qi{padding:15px 16px;margin-bottom:11px}
#dates .qi-h{margin-bottom:2px}
#dates .qi-t{font-size:14px}
#dates .ask{margin-top:12px;padding:13px 14px}
#dates .ask-h{margin-bottom:11px}
#dates .card-s{max-width:62ch}

@media(max-width:860px){
  #dates .qi{padding:14px}
  #dates .ask{padding:12px}
  .qi-p{gap:6px}
  .pill{font-size:10px;padding:3px 8px}
}
@media(max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
  .hero{padding:4px 2px 18px}
  #dates .qi-t{font-size:13.5px;line-height:1.45}
  #dates .ask-h{font-size:11.5px}
  .ask .btn{padding:11px 14px;font-size:13px}
  .ask .dt,.ask .why{padding:11px 12px;font-size:13px}
  .rk{width:18px;height:18px;font-size:10px;margin-right:6px}
}
/* two stat columns even on the narrowest phones — one per row wastes the screen */
@media(max-width:860px){ .btn{min-height:40px} }
@media(max-width:380px){ .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:12px 11px} .stat-v{font-size:20px} .stat-l{font-size:10px} }
</style>
</head>
<body>
<div id="sbd-root">
<div class="wrap">
  <main class="main">
    <div class="top">
      <div><div class="top-t" id="ttl">SBD Build</div><div class="top-s" id="sub">Dev queue</div></div>
      <button class="btn" id="refresh" style="margin-left:auto" hidden>Refresh</button>
    </div>
    <div id="views"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
/* SBD Build — the dev queue.
   One page: what to work on, in order, and the dates to answer. Items arrive
   from the tracker, from the morning brief, or pushed in after the fact.
   Everything else reaches the team through Ignacio. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

const esc=t=>String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const D=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';
const short=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const hdrs=()=>({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`});

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:hdrs(),body:JSON.stringify(args||{})});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Something went wrong on our side.');
  return d;
}
async function q(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:hdrs()});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Could not load the queue.');
  return d||[];
}

let ALL=[], BRIEF=null;
const WHO='sbd_dev_who';
const me=()=>localStorage.getItem(WHO)||'';
const open_=()=>ALL.filter(t=>t.status!=='shipped');

async function load(){
  const [items,briefs]=await Promise.all([
    q('tracker_items?select=number,title,status,priority,sprint,rank,origin,note,how_to_check,'+
      'proposed_on,date_state,counter_on,counter_note,answered_by,answered_at,shipped_on,verified_note,updated_at'+
      '&order=number.asc'),
    q('briefs?select=brief_date,author,body&order=brief_date.desc&limit=1')
  ]);
  ALL=items; BRIEF=briefs[0]||null;
}

const agreed=t=>t.date_state==='countered'?t.counter_on:t.proposed_on;
function ordered(rows){
  return [...rows].sort((a,b)=>{
    if((a.rank==null)!==(b.rank==null)) return a.rank==null?1:-1;
    if(a.rank!=null&&b.rank!=null&&a.rank!==b.rank) return a.rank-b.rank;
    const da=agreed(a), db=agreed(b);
    if(!!da!==!!db) return da?-1:1;
    if(da&&db&&da!==db) return da<db?-1:1;
    const pr={critical:0,high:1,medium:2,low:3};
    return (pr[a.priority]??9)-(pr[b.priority]??9) || a.number-b.number;
  });
}

const prioPill=p=>({critical:P('p-red','Critical'),high:P('p-amb','High'),
                    medium:P('p-blu','Medium'),low:P('p-gry','Low')}[p]||'');
function datePill(t){
  const d=agreed(t); if(!d) return '';
  const n=days(d);
  const label=n<0?`${Math.abs(n)}d over`:n===0?'Today':n===1?'Tomorrow':short(d);
  return P(n<0?'p-red':n<=1?'p-amb':n<=3?'p-amb':'p-gry',label);
}

function dateBlock(t){
  if(!t.proposed_on) return '';
  if(t.date_state==='confirmed')
    return `<div class="agreed"><span class="ag-l">Confirmed</span>${D(t.proposed_on)}${t.answered_by?` &middot; ${esc(t.answered_by)}`:''}</div>`;
  if(t.date_state==='countered')
    return `<div class="agreed ct"><span class="ag-l">Moved to ${D(t.counter_on)}</span>${esc(t.counter_note||'')}${t.answered_by?`<span class="by"> &middot; ${esc(t.answered_by)}</span>`:''}</div>`;
  return `<div class="ask">
    <div class="ask-h">Proposed for <b>${D(t.proposed_on)}</b> &mdash; confirm it, or send a different date with the reason.</div>
    <div class="row">
      <button class="btn btn-g" data-ok="${t.number}">Confirm</button>
      <input class="inp dt" id="nd-${t.number}" type="date" value="${t.proposed_on}">
      <input class="inp why" id="wy-${t.number}" placeholder="Why it needs to move">
      <button class="btn btn-o" data-no="${t.number}">Send this instead</button>
    </div></div>`;
}

/* a queue row, in the reference's task-card idiom */
function card(t,compact){
  const st = t.status==='blocked'?P('p-red','Blocked'):t.status==='in-progress'?P('p-amb','In progress'):'';
  return `<div class="qi${t.rank!=null?' ranked':''}">
    <div class="qi-h">
      <div class="qi-t">${t.rank!=null?`<span class="rk">${t.rank}</span>`:''}${esc(t.title)}</div>
      <div class="qi-p">${prioPill(t.priority)}${datePill(t)}${st}</div>
    </div>
    <div class="qi-m"><span class="hash">#${t.number}</span>${esc(t.origin||'Tracker')}${t.sprint?` &middot; ${esc(t.sprint)}`:''}</div>
    ${!compact&&t.note?`<div class="qi-b">${esc(t.note)}</div>`:''}
    ${!compact&&t.how_to_check?`<div class="check"><span class="check-l">How to check it is done</span>${esc(t.how_to_check)}</div>`:''}
    ${dateBlock(t)}
  </div>`;
}

function bar(pct,tone){ return `<div class="bar"><span class="${tone}" style="width:${Math.max(2,Math.min(100,pct))}%"></span></div>`; }

function view(){
  const rows=ordered(open_());
  const waiting=rows.filter(t=>t.date_state==='pending');
  const rest=rows.filter(t=>t.date_state!=='pending');
  const overdue=rows.filter(t=>{const d=agreed(t);return d&&days(d)<0;});
  const dueSoon=rows.filter(t=>{const d=agreed(t);return d&&days(d)>=0&&days(d)<=1;});

  const proposed=ALL.filter(t=>t.proposed_on);
  const answered=proposed.filter(t=>t.date_state!=='pending').length;
  const sprint=ALL.filter(t=>t.sprint==='S8');
  const sprintDone=sprint.filter(t=>t.status==='shipped').length;

  const hr=new Date().getHours();
  const greet=hr<12?'Good morning':hr<18?'Good afternoon':'Good evening';
  const lead = overdue.length ? `${overdue.length} item${overdue.length>1?'s are':' is'} past its date.`
             : waiting.length ? `${waiting.length} date${waiting.length>1?'s are':' is'} waiting on you.`
             : dueSoon.length ? `${dueSoon.length} due in the next day.`
             : 'Nothing overdue and no dates outstanding.';

  return `
<div class="hero">
  <div class="hero-d">${new Date().toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div>
  <h1 class="hero-t">${greet}, dev team</h1>
  <div class="hero-s">${lead}</div>
  <div class="hero-a">
    <button class="btn btn-g" id="jump">Answer dates${waiting.length?` (${waiting.length})`:''}</button>
    <button class="btn btn-o" id="rf2">Refresh the queue</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><div class="stat-v">${rows.length}</div><div class="stat-l">In the queue</div></div>
  <div class="stat"><div class="stat-v${waiting.length?' amb':''}">${waiting.length}</div><div class="stat-l">Dates to answer</div></div>
  <div class="stat"><div class="stat-v${overdue.length?' red':''}">${overdue.length}</div><div class="stat-l">Past their date</div></div>
  <div class="stat"><div class="stat-v${dueSoon.length?' amb':''}">${dueSoon.length}</div><div class="stat-l">Due today or tomorrow</div></div>
</div>

${BRIEF?`<div class="card">
  <div class="card-h"><div class="ic warm">✦</div>
    <div><div class="card-t">This morning's brief</div>
    <div class="card-s">From ${esc(BRIEF.author)} &middot; ${D(BRIEF.brief_date)}</div></div></div>
  ${briefBlock(BRIEF.body)}
</div>`:''}
${waiting.length?`
<div class="card" id="dates">
  <div class="card-h"><div class="ic warm">◷</div>
    <div><div class="card-t">Dates waiting on you</div>
    <div class="card-s">Confirm what works. A different date is fine &mdash; send the reason with it and it gets taken as given.</div></div></div>
  <div class="f" style="margin-bottom:14px;max-width:340px">
    <input class="inp" id="who" value="${esc(me())}" placeholder="Your name, so Ignacio knows who answered">
  </div>
  ${waiting.map(t=>card(t,true)).join('')}
</div>`:''}

<div class="cols">
  <div class="col">
    <div class="card">
      <div class="card-h"><div class="ic">▤</div>
        <div><div class="card-t">The queue</div>
        <div class="card-s">Ranked work first, then by date</div></div></div>
      ${rest.length?rest.map(t=>card(t,false)).join(''):'<div class="p muted">Nothing outstanding. Anything added to the tracker, pushed in, or carried from a brief appears here on refresh.</div>'}
    </div>
  </div>

  <div class="col side">
    <div class="card">
      <div class="card-h"><div class="ic">◎</div>
        <div><div class="card-t">Where things stand</div></div></div>
      <div class="goal">
        <div class="goal-h"><span>Dates agreed</span><b>${proposed.length?Math.round(answered/proposed.length*100):0}%</b></div>
        ${bar(proposed.length?answered/proposed.length*100:0,'g')}
        <div class="goal-m">${answered} of ${proposed.length} answered</div>
      </div>
      <div class="goal">
        <div class="goal-h"><span>Sprint S8 shipped</span><b>${sprint.length?Math.round(sprintDone/sprint.length*100):0}%</b></div>
        ${bar(sprint.length?sprintDone/sprint.length*100:0,'a')}
        <div class="goal-m">${sprintDone} of ${sprint.length} items</div>
      </div>
      <div class="goal">
        <div class="goal-h"><span>Queue on time</span><b>${rows.length?Math.round((rows.length-overdue.length)/rows.length*100):100}%</b></div>
        ${bar(rows.length?(rows.length-overdue.length)/rows.length*100:100,overdue.length?'r':'g')}
        <div class="goal-m">${overdue.length?`${overdue.length} past date`:'nothing overdue'}</div>
      </div>
    </div>
  </div>
</div>

`;
}

/* Renders the brief the way the document reads: section headings, sub-headings,
   bullets, tables, and bold. Escapes first, so document text can never inject. */
function md(src){
  if(!src) return '';
  const lines=String(src).split(/\r?\n/);
  const inline=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\b(https?:\/\/[^\s<]+)/g,'<span class="mono">$1</span>');
  let out='',list=[],tbl=[];
  const flushList=()=>{ if(list.length){ out+='<ul class="bl">'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; list=[]; } };
  const flushTbl=()=>{
    if(!tbl.length) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const rows=tbl.filter(r=>!/^\|(?:\s*:?-+:?\s*\|)+$/.test(r));
    const head=cells(rows[0]), body=rows.slice(1).map(cells);
    // a two-column table with a blank header is a From/To/Platform block, not a grid
    const defn = head.length===2 && head.every(h=>!h);
    if(defn){
      out+='<dl class="meta">'+body.map(([k,v])=>
        `<dt>${inline(k)}</dt><dd>${inline(v||'')}</dd>`).join('')+'</dl>';
    }else{
      out+='<div class="tblwrap"><table class="btbl"><thead><tr>'+
        head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+
        '</tbody></table></div>';
    }
    tbl=[];
  };
  for(const raw of lines){
    const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ flushList(); tbl.push(l); continue; }
    flushTbl();
    if(/^[-*]\s+/.test(l)){ list.push(inline(l.replace(/^[-*]\s+/,''))); continue; }
    flushList();
    if(!l) continue;
    if(/^###\s+/.test(l))      out+=`<div class="bh3">${inline(l.replace(/^###\s+/,''))}</div>`;
    else if(/^##\s+/.test(l))  out+=`<div class="bh2">${inline(l.replace(/^##\s+/,''))}</div>`;
    else if(/^#\s+/.test(l))   out+=`<div class="bh1">${inline(l.replace(/^#\s+/,''))}</div>`;
    else out+=`<p class="bp">${inline(l)}</p>`;
  }
  flushList(); flushTbl();
  return out;
}

let briefOpen=false;
function briefBlock(body){
  if(!body) return '';
  if(body.length<700) return md(body);
  return `<div class="clamp${briefOpen?' open':''}">${md(body)}</div>
  <div class="morebar"><div class="rule"></div>
    <button class="btn" data-brief="1">${briefOpen?'See less':'See more'}</button>
    <div class="rule"></div></div>`;
}

const views=document.getElementById('views'), toast=document.getElementById('toast');
const refreshBtn=document.getElementById('refresh');
function say(m){ toast.textContent=m; toast.classList.add('on'); setTimeout(()=>toast.classList.remove('on'),2800); }
function draw(){ views.innerHTML=`<div class="view on">${view()}</div>`; }
async function refresh(quiet){
  try{ await load(); draw(); if(!quiet) say('Refreshed.'); }catch(e){ say(e.message); }
}
async function act(fn){ try{ await fn(); await refresh(true); }catch(e){ say(e.message); } }
const val=id=>{const n=document.getElementById(id);return n?n.value.trim():'';};

document.addEventListener('click',e=>{
  if(e.target===refreshBtn||e.target.id==='rf2') return refresh();
  if(e.target.id==='jump'){ const d=document.getElementById('dates');
    if(d) d.scrollIntoView({behavior:'smooth',block:'start'}); return; }
  if(e.target.closest('[data-brief]')){ briefOpen=!briefOpen; return draw(); }

  const ok=e.target.closest('[data-ok]');
  if(ok){ const n=Number(ok.dataset.ok), who=val('who'); if(who) localStorage.setItem(WHO,who);
    return act(async()=>{ await rpc('answer_date',{p_number:n,p_action:'confirm',p_who:who||null});
      say(`#${n} confirmed. Ignacio sees it on his board.`); }); }

  const no=e.target.closest('[data-no]');
  if(no){ const n=Number(no.dataset.no), who=val('who'); if(who) localStorage.setItem(WHO,who);
    return act(async()=>{ await rpc('answer_date',{p_number:n,p_action:'counter',
      p_new_date:val('nd-'+n)||null,p_reason:val('wy-'+n)||null,p_who:who||null});
      say(`#${n} moved to ${short(val('nd-'+n))}. Reason sent with it.`); }); }
});

(async()=>{
  views.innerHTML='<div class="view on"><div class="p muted">Loading the queue...</div></div>';
  try{ await load(); refreshBtn.hidden=false; draw(); }
  catch(e){ views.innerHTML=`<div class="view on"><div class="card"><div class="card-t">Could not load</div>
    <div class="p" style="margin-top:8px">${esc(e.message)}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="location.reload()">Try again</button></div></div></div>`; }
})();
</script>
</body>
</html>
