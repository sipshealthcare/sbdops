*{box-sizing:border-box;margin:0;padding:0}
body{background:#070d1f}
#sbd-root{min-height:100vh;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{display:flex;min-height:100vh}
.side{width:216px;flex:0 0 216px;border-right:1px solid var(--line);display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;transform:translateX(-100%);transition:transform .22s}
.side.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
.bmark{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:11px;flex:0 0 30px}
.bname{font-weight:600;font-size:14px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.nav{padding:2px 10px 16px;overflow-y:auto;flex:1}
.nav-l{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;padding:10px 8px 6px}
.nav-i{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:10px 11px;border:0;border-radius:8px;font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:2px;font-family:inherit}
.nav-n{font-size:11px;font-weight:600;border-radius:20px;padding:1px 7px;min-width:21px;text-align:center}
.main{flex:1;min-width:0;padding:14px 14px 40px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 18px}
.burger{width:36px;height:36px;border:1px solid var(--line);border-radius:9px;background:none;display:grid;place-content:center;gap:4px;cursor:pointer;flex:0 0 36px}
.burger span{width:15px;height:2px;border-radius:2px;display:block}
.top-t{font-size:20px;font-weight:600;line-height:1.2}
.top-s{font-size:12.5px;margin-top:1px}
.view{display:none}.view.on{display:block}
.max{max-width:760px}
.card{border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:13px}
.card-h{margin-bottom:14px}
.card-t{font-size:15.5px;font-weight:600}
.card-s{font-size:12.5px;margin-top:2px}
.p{font-size:13.5px;margin-bottom:10px}
.p:last-child{margin-bottom:0}
.lead{font-weight:600}
.muted{font-size:12.5px}
.sec{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;margin:20px 0 9px}
.sec:first-child{margin-top:0}
.note{font-size:12.5px;border-radius:10px;padding:12px 14px;border-left:3px solid var(--gold);margin-bottom:16px}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin-bottom:10px}
.item-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:5px}
.item-t{font-size:14px;font-weight:600;line-height:1.4}
.item-m{font-size:11px;margin-top:7px}
.item-b{font-size:13px;margin-top:6px}
.due{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:10px;padding:12px 14px;margin-bottom:9px;font-size:13.5px;font-weight:600;flex-wrap:wrap}
.due-d{font-size:12px;font-weight:600;letter-spacing:.03em}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.tbl thead,.tbl tbody,.tbl tr{display:table;width:100%;table-layout:fixed}
.tbl th{text-align:left;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;padding:9px 11px}
.tbl td{padding:10px 11px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.tbl th:first-child,.tbl td:first-child{width:66px;white-space:nowrap}
.btn{border:0;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.lbl{display:block;font-size:13.5px;font-weight:600;margin-bottom:3px}
.hint{display:block;font-size:12px;margin-bottom:9px}
.ta{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5;min-height:90px;resize:vertical}
.inp{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font-size:14px;font-family:inherit;line-height:1.5}
.ta:focus,.inp:focus{outline:2px solid var(--gold);outline-offset:-1px}
.st{border:1px solid var(--line);border-radius:8px;padding:7px 13px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.f{margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,80px);padding:12px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:35;display:none}
.scrim.on{display:block}
@media(min-width:900px){
  .side{position:sticky;height:100vh;transform:none}
  .scrim,.burger{display:none!important}
  .main{padding:22px 30px 60px}
  .top-t{font-size:23px}
}
.clamp{position:relative;overflow:hidden;max-height:280px}
.clamp.open{max-height:min(62vh,560px);overflow-y:auto;padding-right:14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  padding-top:14px;padding-bottom:14px;
  scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.clamp.open::-webkit-scrollbar{width:9px}
.clamp.open::-webkit-scrollbar-track{background:transparent}
.clamp.open::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
.clamp.open::-webkit-scrollbar-thumb:hover{background:var(--gold)}
.clamp:not(.open)::after{content:'';position:absolute;left:0;right:0;bottom:0;height:76px;
  background:linear-gradient(to bottom,rgba(14,19,40,0) 0%,#0e1328 92%);pointer-events:none}
.morebar{display:flex;align-items:center;gap:10px;margin-top:12px}
.morebar .rule{flex:1;height:1px;background:var(--line)}

/* daily brief typography */
.bh1{font-size:17px;font-weight:600;color:#fff;margin:22px 0 8px;letter-spacing:-.01em}
.bh2{font-size:13px;font-weight:600;color:var(--gold);margin:26px 0 10px;
  letter-spacing:.08em;text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--line)}
.bh3{font-size:14.5px;font-weight:600;color:#fff;margin:19px 0 7px}
.bh2:first-child,.bh1:first-child,.bh3:first-child{margin-top:0}
.bp{font-size:13.5px;line-height:1.68;color:#cbd5e5;margin:0 0 12px;max-width:68ch}
.bl{margin:0 0 13px;padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:7px}
.bl li{font-size:13.5px;line-height:1.6;color:#cbd5e5;padding-left:17px;position:relative;max-width:66ch}
.bl li:before{content:'';position:absolute;left:2px;top:9px;width:5px;height:5px;
  border-radius:50%;background:var(--gold);opacity:.75}
.meta{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;margin:0 0 18px;
  padding:14px 16px;background:var(--lift);border-radius:10px;border-left:3px solid var(--gold)}
.meta dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);
  font-weight:600;padding-top:2px;white-space:nowrap}
.meta dd{font-size:13px;color:#e6ebf5;margin:0}
.tblwrap{overflow-x:auto;margin:0 0 16px}
.btbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:420px}
.btbl th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:600;color:var(--dim);background:var(--lift);padding:9px 12px;white-space:nowrap}
.btbl th:first-child{border-radius:8px 0 0 0} .btbl th:last-child{border-radius:0 8px 0 0}
.btbl td{padding:10px 12px;border-top:1px solid var(--line);color:#cbd5e5;vertical-align:top;line-height:1.5}
.btbl tbody tr:hover td{background:rgba(212,154,0,.045)}
.bp b,.bl b,.btbl b{color:#fff;font-weight:600}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--gold)}

.check{margin-top:7px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.proof{margin-top:7px;font-size:11.5px;line-height:1.5;color:#cbd5e5;
  border-left:2px solid var(--grn);padding:3px 0 3px 9px}
.proof-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grn);font-weight:600;margin-bottom:2px}

.wrap{display:block}
.main{max-width:860px;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:13px}
.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card)}
.stat-v{font-size:23px;font-weight:700;line-height:1.1;color:#fff}
.stat-v.amb{color:var(--amb)} .stat-v.red{color:var(--red)}
.stat-l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:5px;color:var(--dim)}
.qi{border:1px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:10px;background:var(--card)}
.qi.top{border-left:3px solid var(--gold)}
.qi-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qi-t{font-size:14px;font-weight:600;line-height:1.4;color:#fff}
.qi-p{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto}
.rk{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;
  background:var(--gold);color:#000;font-size:11px;font-weight:700;margin-right:7px;vertical-align:1px}
.qi-m{font-size:11px;color:var(--mut);margin-top:6px}
.qi-b{font-size:12.5px;color:#cbd5e5;margin-top:8px;line-height:1.55}
.check{margin-top:9px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.ask{margin-top:11px;padding:11px 12px;border-radius:9px;background:var(--lift)}
.ask-h{font-size:12px;color:#cbd5e5;margin-bottom:9px}
.ask-h b{color:#fff}

/* ── queue layout, warm-bloom variant ───────────────────────────── */
body{background:#070d1f}
#sbd-root{position:relative;overflow-x:hidden}

.main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;gap:12px;padding:2px 0 14px}

.hero{padding:8px 2px 22px}
.hero-d{font-size:12px;color:var(--dim);letter-spacing:.02em}
.hero-t{font-size:31px;font-weight:600;line-height:1.12;margin-top:7px;color:#fff;letter-spacing:-.02em}
.hero-s{font-size:16px;color:var(--dim);margin-top:5px;font-weight:400}
.hero-a{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}

  background:var(--lift);color:var(--gold);border:1px solid var(--gold)}

.btn-doc .doc-i{font-size:14px;line-height:1}
.hero-a .btn{padding:11px 20px;font-size:13.5px;border-radius:11px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:11px;margin-bottom:15px}
.stat{border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:var(--card)}

.stat-v.amb{color:var(--amb)} .stat-v.red{color:var(--red)}
.stat-l{font-size:11px;letter-spacing:.03em;margin-top:7px;color:var(--dim)}

.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:15px;align-items:start}
.col{display:flex;flex-direction:column;gap:15px;min-width:0}
.card{border:1px solid var(--line);border-radius:17px;padding:18px;margin:0;background:var(--card)}
.card-h{display:flex;align-items:flex-start;gap:11px;margin-bottom:15px}
.ic{width:34px;height:34px;border-radius:11px;flex:0 0 34px;display:grid;place-items:center;
  background:var(--lift);color:var(--dim);font-size:15px;line-height:1}
.ic.warm{background:linear-gradient(140deg,#D49A00,#8a6400);color:#000}

.qi{border:1px solid var(--line);border-radius:13px;padding:13px 14px;margin-bottom:9px;background:var(--lift);min-width:0;overflow-wrap:anywhere}
.qi:last-child{margin-bottom:0}
.qi.ranked{border-color:rgba(212,154,0,.42)}
.qi-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.qi-t{font-size:13.5px;font-weight:600;line-height:1.42;color:#fff;min-width:0;flex:1 1 auto;overflow-wrap:anywhere}
.qi-p{display:flex;gap:5px;flex-wrap:wrap;flex:0 0 auto}
.rk{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:6px;
  background:var(--gold);color:#000;font-size:10.5px;font-weight:700;margin-right:7px;vertical-align:1px}
.qi-m{font-size:11px;color:var(--mut);margin-top:6px}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);margin-right:7px}
.qi-b{font-size:12.5px;color:#cbd5e5;margin-top:8px;line-height:1.55}
.p-blu{background:rgba(120,150,235,.15);color:#93a9ee}

.check{margin-top:9px;font-size:11.5px;line-height:1.5;color:#94a3b8;
  border-left:2px solid var(--line);padding:3px 0 3px 9px}
.check-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin-bottom:2px}
.ask{margin-top:11px;padding:11px 12px;border-radius:10px;background:#0b1226;border:1px solid var(--line)}
.ask-h{font-size:12px;color:#cbd5e5;margin-bottom:9px;line-height:1.5}
.ask-h b{color:#fff}
.ask .dt{flex:0 0 146px;padding:8px 9px;font-size:12px}
.ask .why{flex:1 1 220px;min-width:0;padding:8px 9px;font-size:12px}
.agreed{margin-top:10px;font-size:12px;color:#cbd5e5;border-left:2px solid var(--grn);padding:3px 0 3px 9px}
.agreed.ct{border-color:var(--amb)}
.ag-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--grn);font-weight:600;margin-bottom:2px}
.agreed.ct .ag-l{color:var(--amb)}
.agreed .by{color:var(--mut)}

.goal{margin-bottom:15px}.goal:last-child{margin-bottom:0}
.goal-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:#cbd5e5}
.goal-h b{color:#fff;font-size:13px;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.bar span{display:block;height:100%;border-radius:4px}
.bar .g{background:var(--grn)} .bar .a{background:var(--gold)} .bar .r{background:var(--red)}
.goal-m{font-size:11px;color:var(--mut);margin-top:5px}

@media(max-width:1000px){.cols{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.stats{grid-template-columns:1fr}.hero-t{font-size:25px}.ask .why{min-width:100%}}

@media(max-width:860px){

}

/* ── sidebar ─────────────────────────────────────────────────────── */
.wrap{display:flex;min-height:100vh}
.side{width:236px;flex:0 0 236px;border-right:1px solid var(--line);display:flex;
  flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:40;
  transform:translateX(-100%);transition:transform .22s;background:#0a1024}
.side.open{transform:none}
.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 16px}
.bmark{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-weight:700;font-size:11px;flex:0 0 32px}
.bname{font-weight:600;font-size:14.5px}
.bsub{font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.nav{padding:4px 11px 16px;overflow-y:auto;flex:1}
.nav-l{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:10px 9px 7px}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:0;
  border-radius:11px;font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:3px;
  font-family:inherit;background:none;transition:background .15s,color .15s}
.nav-i .ni{width:17px;flex:0 0 17px;text-align:center;font-size:13px;opacity:.85}
.nav-i span.lbl{flex:1;min-width:0}
.nav-n{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;min-width:22px;text-align:center}
.nav-i.on{background:linear-gradient(120deg,rgba(212,154,0,.92),rgba(212,154,0,.55));color:#000;font-weight:600}
.nav-i.on .nav-n{background:rgba(0,0,0,.22);color:#000}
.sidefoot{padding:14px 16px 18px;font-size:11px;line-height:1.55;color:var(--mut);
  border-top:1px solid var(--line)}
.dlink{display:flex;align-items:center;gap:8px;margin-top:12px;padding:9px 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--lift);
  color:var(--gold);font-size:12px;font-weight:600;text-decoration:none}
.dlink:hover{border-color:var(--gold);background:rgba(212,154,0,.08)}
.dlink .dl-i{font-size:13px;line-height:1}
.main{flex:1;min-width:0;position:relative;z-index:1;max-width:none;margin:0;padding:20px 22px 60px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:35;display:none}
.scrim.on{display:block}
.burger{width:38px;height:38px;border:1px solid var(--line);border-radius:10px;background:none;
  display:grid;place-content:center;gap:4px;cursor:pointer;flex:0 0 38px}
.burger span{width:15px;height:2px;border-radius:2px;display:block;background:var(--txt)}
@media(min-width:1000px){
  .side{position:sticky;height:100vh;transform:none}
  .scrim,.burger{display:none!important}
  .main{padding:22px 30px 70px}
}

.askq{margin-top:10px}
.lnkq{font-size:11.5px;padding:7px 12px}
.qrow{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.qrow .inp{flex:1 1 240px;min-width:0;padding:9px 11px;font-size:12.5px}
.agreed.wt{border-color:var(--gold)}
.agreed.wt .ag-l{color:var(--gold)}
@media(max-width:860px){ .qrow{flex-direction:column} .qrow .inp,.qrow .btn{width:100%} }
.mini{display:flex;justify-content:space-between;gap:9px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-of-type{border-bottom:0}
.mini-t{color:#cbd5e5;min-width:0;overflow-wrap:anywhere}

/* the counter path is its own labelled action, not a date lost between buttons */
.orbar{display:flex;align-items:center;gap:10px;margin:13px 0 11px;
  font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.orbar:before,.orbar:after{content:'';flex:1;height:1px;background:var(--line)}
.counter{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld-d{flex:0 0 190px}
.fld-w{flex:1 1 260px}
.counter .flab{font-size:11px;color:var(--dim);white-space:nowrap}
.counter .inp{padding:9px 11px;font-size:12.5px;width:100%}
.counter .send{flex:0 0 auto;margin-top:23px}
/* .ask .why sets a row flex-basis; inside a column .fld that would become a
   220px tall input, so neutralise it here */
.fld .inp,.fld .why,.fld .dt,.fld .dtwrap{flex:0 0 auto;height:auto}
/* the date field must read as editable */
.inp[type=date]{cursor:pointer}
.inp[type=date]:hover{border-color:var(--gold)}
/* hidden must beat display:flex */
.qrow[hidden]{display:none!important}
@media(max-width:860px){
  .counter{flex-direction:column;gap:11px}
  .fld-d,.fld-w{flex:1 1 auto;width:100%}
  .counter .send{margin-top:0;width:100%}
}

/* original and new dates read side by side, never in the same field */
.dpair{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.dp{display:flex;flex-direction:column;gap:3px}
.dp-l{font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.dp-v{font-size:13.5px;font-weight:600}
.dp-v.old{color:var(--dim)}
.dp-v.new{color:var(--amb)}
.dp-ar{color:var(--mut);font-size:14px;padding-bottom:2px}
.dp-why{font-size:12px;color:#cbd5e5;margin-top:9px;line-height:1.5}

.dtwrap{position:relative;display:block}
.dtwrap .inp{width:100%;padding-right:30px;cursor:pointer}
.dtwrap .dtico{position:absolute;right:11px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:11px;pointer-events:none}
.dtwrap:hover .inp{border-color:var(--gold)}
.dtwrap:hover .dtico{color:var(--gold)}
.dtwrap .inp[type=date]::-webkit-calendar-picker-indicator{opacity:0;position:absolute;right:0;
  width:100%;height:100%;cursor:pointer}
.inp[type=date]::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;
  filter:invert(.72);padding:0;margin:0}
.inp[type=date]:hover::-webkit-calendar-picker-indicator{opacity:1}
.quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.qd{border:1px solid var(--line);background:var(--lift);color:var(--dim);border-radius:7px;
  padding:5px 9px;font-size:11px;font-family:inherit;cursor:pointer;font-weight:500;white-space:nowrap}
.qd:hover{border-color:var(--gold);color:var(--txt)}
.qd.on{background:var(--gold);color:#000;border-color:var(--gold);font-weight:600}
.donerow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.donerow .why{flex:1 1 220px;min-width:0;padding:8px 11px;font-size:12px}
@media(max-width:860px){.donerow{flex-direction:column}.donerow .why,.donerow .btn{width:100%}}
.nodate{margin-top:10px;padding:9px 12px;border-radius:9px;background:var(--lift);
  border-left:2px solid var(--amb);font-size:12px;color:#cbd5e5}
.nd-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--amb);font-weight:600;margin-bottom:3px}

/* Answers from Ignacio.
   An answer nobody has confirmed reading is still an open loop, so unread is
   the loud state and read is the quiet one. */
.ans{border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:11px;
  background:var(--lift);min-width:0;overflow-wrap:anywhere}
.ans:last-child{margin-bottom:0}
.ans.fresh{border-color:rgba(212,154,0,.45);background:rgba(212,154,0,.055)}
.ans-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ans-q{font-size:14.5px;font-weight:600;color:#fff;line-height:1.45;min-width:0}
.ans-p{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.ans-m{font-size:11px;color:var(--mut);margin-top:7px;display:flex;flex-wrap:wrap;
  gap:4px 10px;align-items:center}
.ans-m .hash{font-weight:700;color:var(--gold);letter-spacing:.02em}
.ans-ctx{font-size:12px;line-height:1.6;color:var(--dim);margin-top:10px;
  border-left:2px solid var(--line);padding:2px 0 2px 11px;max-width:80ch}
.ans-ctx.fu-sent{border-left-color:var(--amb);color:#cbd5e5}
.ans-b{margin-top:13px;border-left:3px solid var(--gold);padding:2px 0 2px 13px}
.ans-l{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--gold);font-weight:700;margin-bottom:5px}
.ans-t{font-size:13.5px;line-height:1.68;color:#e6ebf5;white-space:pre-wrap;max-width:80ch}
.ans-why{margin-top:12px;border-left:2px solid var(--line);padding:2px 0 2px 13px}
.ans-why .ans-l{color:var(--mut)}
.ans-why .ans-t{font-size:12.5px;line-height:1.62;color:#94a3b8}
.ans-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px;
  padding-top:13px;border-top:1px solid var(--line)}
.ans-seen{font-size:11.5px;color:var(--grn);font-weight:600;margin-right:2px}
.ans-seen.carry{color:var(--mut);font-weight:500;line-height:1.55;max-width:70ch}
.ans-seen .sd{color:var(--mut);font-weight:500}
.fu{margin-top:12px;padding:12px 13px;border-radius:10px;background:rgba(224,161,50,.06);
  border:1px solid rgba(224,161,50,.28)}
.fu-h{font-size:11.5px;color:var(--dim);line-height:1.55;margin-bottom:9px;max-width:74ch}
.fu textarea.inp{width:100%;padding:10px 12px;font-size:12.5px;line-height:1.55;
  min-height:82px;resize:vertical;font-family:inherit}
.fu[hidden]{display:none!important}
.bi{margin-top:12px;padding:12px 13px;border-radius:10px;background:rgba(63,185,132,.06);
  border:1px solid rgba(63,185,132,.28)}
.bi-h{font-size:11.5px;color:var(--dim);line-height:1.55;margin-bottom:9px;max-width:74ch}
.bi-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--mut);font-weight:600;margin:12px 0 5px}
.bi .quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bi[hidden]{display:none!important}

/* The board is only worth anything if it matches the work. No dismiss button on
   purpose: it goes when the board is current, not when it is waved away. */
.stale{position:sticky;top:0;z-index:25;margin:0 0 16px;padding:14px 16px 13px;
  border-radius:14px;background:linear-gradient(180deg,#2a1e05,#1a1608);
  border:1px solid rgba(224,161,50,.45);box-shadow:0 10px 26px rgba(0,0,0,.45)}
.stale-h{display:flex;align-items:flex-start;gap:12px}
.stale-d{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--amb);
  margin-top:5px;animation:stalep 2.4s ease-in-out infinite}
@keyframes stalep{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(224,161,50,.55)}
  50%{opacity:.65;box-shadow:0 0 0 7px rgba(224,161,50,0)}}
@media(prefers-reduced-motion:reduce){.stale-d{animation:none}}
.stale-t{font-size:14.5px;font-weight:700;color:#f4d58a;letter-spacing:-.01em;padding-top:1px}
.stale-r{margin-left:auto;flex:0 0 auto;border-color:rgba(224,161,50,.5);color:#f4d58a}
.stale-l{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.stale-i{display:flex;align-items:center;gap:11px;padding:9px 0;
  border-top:1px solid rgba(224,161,50,.18)}
.stale-n{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--amb);color:#1a1608;font-size:12.5px;font-weight:800}
.stale-x{min-width:0;flex:1}
.stale-x b{display:block;font-size:13px;font-weight:600;color:#f6e6c2;line-height:1.4}
.stale-x span{display:block;font-size:11.5px;color:#bfa77f;line-height:1.5;margin-top:2px}
.stale-g{flex:0 0 auto;padding:7px 13px;font-size:11.5px;
  border-color:rgba(224,161,50,.45);color:#f4d58a}
.stale-g:hover,.stale-r:hover{background:rgba(224,161,50,.14)}
@media(max-width:760px){
  .stale-h{flex-wrap:wrap}
  .stale-r{margin-left:0;width:100%;order:3;margin-top:10px}
  .stale-i{flex-wrap:wrap}
  .stale-g{width:100%;margin-left:37px}
}

/* a date that has already gone by is not a status, it is a decision to make */
.late{margin-top:11px;padding:12px 13px;border-radius:10px;
  background:rgba(240,97,109,.07);border:1px solid rgba(240,97,109,.3)}
.late-l{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--red);font-weight:700;margin-bottom:5px}
.late-s{font-size:11.5px;color:var(--dim);line-height:1.55;margin-bottom:11px;max-width:72ch}

/* Charts. Thin marks, hairline chrome, and every value appears in text as well as
   in the mark, so nothing here is readable by colour alone. */
.ch-s{font-size:11.5px;color:var(--dim);line-height:1.55;margin:-4px 0 14px;max-width:72ch}
.stack{display:flex;gap:2px;height:32px;width:100%}
.stack .sg{height:100%;min-width:4px}
.stack .sg:first-child{border-radius:6px 0 0 6px}
.stack .sg:last-child{border-radius:0 6px 6px 0}
.stack .sg:only-child{border-radius:6px}
.leg{display:flex;flex-wrap:wrap;gap:9px 20px;margin-top:15px}
.lg{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
.lg .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.lg .lv{color:#e6ebf5;font-weight:700;font-variant-numeric:tabular-nums}
.cols2{display:flex;align-items:flex-end;gap:7px;margin-top:4px}
.c2{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end}
.c2-v{font-size:11px;font-weight:700;color:#e6ebf5;text-align:center;height:16px;
  font-variant-numeric:tabular-nums}
.c2-b{background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;opacity:.55}
.c2.on .c2-b{opacity:1}
.c2-l{font-size:10px;color:var(--mut);text-align:center;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line);white-space:nowrap}
.nd2{border:1px solid rgba(212,154,0,.42);background:rgba(212,154,0,.05);
  border-radius:13px;padding:13px 14px;margin-bottom:10px}
.nd2:last-of-type{margin-bottom:0}
.nd2-q{font-size:13.5px;font-weight:600;color:#fff;line-height:1.45}
.nd2-m{font-size:11px;color:var(--mut);margin-top:5px}
.nd2-m .hash{color:var(--gold);font-weight:700}
.nd2-a{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
@media(max-width:760px){ .nd2-a{flex-direction:column} .nd2-a .btn{width:100%} }
.bi-done{margin-top:11px;font-size:12px;line-height:1.55;color:#cbd5e5;
  border-left:2px solid var(--grn);padding:3px 0 3px 11px;max-width:76ch}
@media(max-width:860px){ .ans-act{flex-direction:column;align-items:stretch}
  .ans-act .btn{width:100%} .ans-h{flex-direction:column;gap:7px}
  .ans-p{justify-content:flex-start} }

/* Speak instead of typing. One floating button follows whichever field has focus,
   so no layout on any page has to make room for it. */
.micb{position:fixed;z-index:60;width:26px;height:26px;border-radius:8px;
  border:1px solid var(--line);background:var(--lift);color:var(--dim);
  display:none;place-items:center;cursor:pointer;padding:0;font-family:inherit;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.micb.on2{display:grid}
.micb:hover{color:var(--gold);border-color:var(--gold)}
.micb.rec{color:#000;background:var(--gold);border-color:var(--gold);
  animation:micp 1.25s ease-in-out infinite}
@keyframes micp{0%,100%{box-shadow:0 0 0 0 rgba(212,154,0,.55)}
  50%{box-shadow:0 0 0 7px rgba(212,154,0,0)}}
@media(prefers-reduced-motion:reduce){.micb.rec{animation:none}}
.michint{position:fixed;z-index:60;font-size:10.5px;font-weight:600;color:#000;
  background:var(--gold);border-radius:7px;padding:3px 8px;display:none;white-space:nowrap;
  box-shadow:0 2px 8px rgba(0,0,0,.35)}
.michint.on2{display:block}
</style>

<body>
<div id="sbd-root">
<div class="wrap">
  <aside class="side" id="side">
    <div class="brand"><div class="bmark">DEV</div>
      <div><div class="bname">SBD Build</div><div class="bsub">Dev team</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidefoot">
      Everything here comes from Ignacio or the tracker. Send EODs the way you always have.
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="top">
      <button class="burger" id="burger" aria-label="Sections"><span></span><span></span><span></span></button>
      <div><div class="top-t" id="ttl">SBD Build</div><div class="top-s" id="sub">Dev queue</div></div>
      <button class="btn" id="refresh" style="margin-left:auto" hidden>Refresh</button>
    </div>
    <div id="stale"></div>
    <div id="views"></div>
  </main>
</div>
<div class="toast" id="toast"></div>
</div>

<script>
/* SBD Build — the dev queue.
   One page: what to work on, in order, and the dates to answer. Items arrive
   from the tracker, from the morning brief, or pushed in after the fact.
   Everything else reaches the team through Ignacio. */
const SB_URL='https://uwgpjjbbfwqiumzfkwuy.supabase.co';
const SB_KEY='sb_publishable_USi4uTOHHwrNjKXB3-bbDQ_Gzk7PN2q';

const esc=t=>String(t??'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const P=(c,t)=>`<span class="pill ${c}">${t}</span>`;
const D=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}):'';
const short=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):'';
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>Math.round((new Date(d+'T12:00:00')-new Date(today()+'T12:00:00'))/86400000);
const hdrs=()=>({'Content-Type':'application/json','apikey':SB_KEY,'Authorization':`Bearer ${SB_KEY}`});

async function rpc(fn,args){
  const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',cache:'no-store',headers:hdrs(),body:JSON.stringify(args||{})});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Something went wrong on our side.');
  return d;
}
async function q(path){
  const r=await fetch(`${SB_URL}/rest/v1/${path}`,{headers:hdrs(),cache:'no-store'});
  let d=null; try{ d=await r.json(); }catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||'Could not load the queue.');
  return d||[];
}

let ALL=[], BRIEF=null, DEC=[], EOD=[], MARK=null;
const WHO='sbd_dev_who';
const me=()=>localStorage.getItem(WHO)||'';
const open_=()=>ALL.filter(t=>t.status!=='shipped');
/* Decided means Ignacio has put an answer on it. A question still sitting with
   him is not the dev team's to look at, so it never reaches this surface. */
const decided=()=>DEC.filter(d=>d.status!=='open'&&String(d.answer||'').trim());
const unreadAns=()=>decided().filter(d=>!d.seen_at);
const kidsOf=ref=>DEC.filter(d=>d.parent_ref===ref);

async function load(){
  const [items,briefs,dec,eod,mark]=await Promise.all([
    q('tracker_items?select=number,title,status,priority,sprint,rank,origin,note,how_to_check,'+
      'proposed_on,date_state,counter_on,counter_note,answered_by,answered_at,shipped_on,verified_note,updated_at,'+
      'question_note,question_by,question_at,reply_note,reply_by,reply_at'+
      '&order=number.asc'),
    q('briefs?select=brief_date,author,body&order=brief_date.desc&limit=1'),
    q('decisions?select=ref,question,blocks,note,raised_on,status,answer,reasoning,verdict,'+
      'answered_on,review_on,seen_at,seen_by,parent_ref,asked_by'+
      '&order=answered_on.desc.nullslast,ref.desc'),
    q('eod_reports?select=report_date,author&order=report_date.desc&limit=1'),
    q('ops_marks?select=key,at,by&key=eq.tracker_synced')
  ]);
  ALL=items; BRIEF=briefs[0]||null; DEC=dec; EOD=eod; MARK=(mark&&mark[0])||null;
}

const agreed=t=>t.date_state==='countered'?t.counter_on:t.proposed_on;
function ordered(rows){
  return [...rows].sort((a,b)=>{
    if((a.rank==null)!==(b.rank==null)) return a.rank==null?1:-1;
    if(a.rank!=null&&b.rank!=null&&a.rank!==b.rank) return a.rank-b.rank;
    const da=agreed(a), db=agreed(b);
    if(!!da!==!!db) return da?-1:1;
    if(da&&db&&da!==db) return da<db?-1:1;
    const pr={critical:0,high:1,medium:2,low:3};
    return (pr[a.priority]??9)-(pr[b.priority]??9) || a.number-b.number;
  });
}

const prioPill=p=>({critical:P('p-red','Critical'),high:P('p-amb','High'),
                    medium:P('p-blu','Medium'),low:P('p-gry','Low')}[p]||'');
function datePill(t){
  const d=agreed(t); if(!d) return '';
  const n=days(d);
  const label=n<0?`${Math.abs(n)}d over`:n===0?'Today':n===1?'Tomorrow':short(d);
  return P(n<0?'p-red':n<=1?'p-amb':n<=3?'p-amb':'p-gry',label);
}


/* Faster than a calendar for the dates people actually pick. */
function quickDates(from){
  const d0=new Date(today()+'T12:00:00');
  const mk=n=>{const d=new Date(d0); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10);};
  const nextDow=dow=>{const d=new Date(d0); const add=((dow-d.getDay())+7)||7; d.setDate(d.getDate()+add); return d.toISOString().slice(0,10);};
  const out=[{label:'Tomorrow',iso:mk(1)},{label:'In 3 days',iso:mk(3)},
             {label:'Next Fri',iso:nextDow(5)},{label:'Next Mon',iso:nextDow(1)},
             {label:'In 2 weeks',iso:mk(14)}];
  const seen=new Set([from]);
  return out.filter(x=>!seen.has(x.iso)&&(seen.add(x.iso),true));
}

function dateBlock(t){
  if(!t.proposed_on) return '';
  if(t.date_state==='confirmed'){
    if(days(t.proposed_on)>=0)
      return `<div class="agreed"><span class="ag-l">Confirmed</span>${D(t.proposed_on)}${t.answered_by?` &middot; ${esc(t.answered_by)}`:''}</div>`;
    return `<div class="late"><span class="late-l">This date has passed &middot; ${Math.abs(days(t.proposed_on))}d over</span>
      <div class="late-s">Agreed for ${D(t.proposed_on)}. If it is done, mark it done above with how you checked it. If it slipped, send the date you can hit and the reason. It reaches Ignacio as a date sent back, so nothing moves quietly.</div>
      <div class="counter">
        <div class="fld fld-d">
          <label class="flab" for="nd-${t.number}">New date</label>
          <div class="dtwrap"><input class="inp dt" id="nd-${t.number}" type="date" min="${today()}">
            <span class="dtico">\u25BE</span></div>
          <div class="quick">${quickDates(t.proposed_on).map(x=>
            `<button class="qd" data-qd="${t.number}" data-d="${x.iso}">${x.label}</button>`).join('')}</div>
        </div>
        <div class="fld fld-w">
          <label class="flab" for="wy-${t.number}">Why it moved</label>
          <input class="inp why" id="wy-${t.number}" placeholder="It gets taken as given, so say why">
        </div>
        <button class="btn btn-o send" data-no="${t.number}">Send this date</button>
      </div></div>`;
  }
  if(t.date_state==='countered')
    return `<div class="agreed ct">
      <span class="ag-l">Sent back, waiting on Ignacio</span>
      <div class="dpair">
        <div class="dp"><span class="dp-l">Originally proposed</span><span class="dp-v old">${D(t.proposed_on)}</span></div>
        <div class="dp-ar">&rarr;</div>
        <div class="dp"><span class="dp-l">You sent back</span><span class="dp-v new">${D(t.counter_on)}</span></div>
      </div>
      ${t.counter_note?`<div class="dp-why">${esc(t.counter_note)}</div>`:''}
      ${t.answered_by?`<span class="by">${esc(t.answered_by)}</span>`:''}</div>`;
  return `<div class="ask">
    <div class="dpair" style="margin-bottom:12px">
      <div class="dp"><span class="dp-l">Proposed by Ignacio</span><span class="dp-v old">${D(t.proposed_on)}</span></div>
    </div>
    <div class="row"><button class="btn btn-g" data-ok="${t.number}">Confirm ${short(t.proposed_on)}</button></div>
    <div class="orbar"><span>or propose a different date</span></div>
    <div class="counter">
      <div class="fld fld-d">
        <label class="flab" for="nd-${t.number}">New proposed date</label>
        <div class="dtwrap"><input class="inp dt" id="nd-${t.number}" type="date" min="${today()}">
          <span class="dtico">\u25BE</span></div>
        <div class="quick">${quickDates(t.proposed_on).map(x=>
          `<button class="qd" data-qd="${t.number}" data-d="${x.iso}">${x.label}</button>`).join('')}</div>
      </div>
      <div class="fld fld-w">
        <label class="flab" for="wy-${t.number}">Why it needs to move</label>
        <input class="inp why" id="wy-${t.number}" placeholder="It gets taken as given, so say why">
      </div>
      <button class="btn btn-o send" data-no="${t.number}">Send this date back</button>
    </div></div>`;
}

/* a queue row, in the reference's task-card idiom */
function card(t,compact){
  const st = t.status==='blocked'?P('p-red','Blocked'):t.status==='in-progress'?P('p-amb','In progress'):'';
  return `<div class="qi${t.rank!=null?' ranked':''}">
    <div class="qi-h">
      <div class="qi-t">${t.rank!=null?`<span class="rk">${t.rank}</span>`:''}${esc(t.title)}</div>
      <div class="qi-p">${prioPill(t.priority)}${datePill(t)}${st}</div>
    </div>
    <div class="qi-m"><span class="hash">#${t.number}</span>${esc(t.origin||'Tracker')}${t.sprint?` &middot; ${esc(t.sprint)}`:''}</div>
    ${!compact&&t.note?`<div class="qi-b">${esc(t.note)}</div>`:''}
    ${!compact&&t.how_to_check?`<div class="check"><span class="check-l">How to check it is done</span>${esc(t.how_to_check)}</div>`:''}
    ${dateBlock(t)}
    ${t.status!=='shipped'&&t.status!=='backlog'&&!t.proposed_on
      ?'<div class="nodate"><span class="nd-l">No date set</span>Ignacio has not put a date on this yet.</div>':''}
    ${askBlock(t)}
    ${t.status!=='shipped'?`<div class="donerow">
      <input class="inp why" id="dn-${t.number}" placeholder="How you checked it is live">
      <button class="btn btn-o" data-done="${t.number}">Mark it done</button></div>`:''}
  </div>`;
}

/* Blocking an item on Ignacio. While it is open the item shows as waiting;
   his answer comes back with a proposed date, which lands in Dates to answer. */
const waitingOnHim=t=>t.question_at&&!t.reply_at;
function askBlock(t){
  if(waitingOnHim(t))
    return `<div class="agreed wt"><span class="ag-l">Waiting on Ignacio</span>${esc(t.question_note)}
      ${t.question_by?`<span class="by"> &middot; asked by ${esc(t.question_by)}</span>`:''}</div>`;
  if(t.reply_at)
    return `<div class="agreed"><span class="ag-l">Answered by ${esc(t.reply_by||'Ignacio')}</span>${esc(t.reply_note)}</div>`;
  return `<div class="askq">
    <button class="btn btn-o lnkq" data-qopen="${t.number}">Need an answer from Ignacio</button>
    <div class="qrow" id="qr-${t.number}" hidden>
      <input class="inp" id="qt-${t.number}" placeholder="What do you need decided before this can move?">
      <button class="btn btn-g" data-qsend="${t.number}">Send it</button>
    </div>
  </div>`;
}

/* the most recent weekday before today: on Monday that is Friday */
function lastWorkday(){
  const d=new Date(today()+'T12:00:00');
  do{ d.setDate(d.getDate()-1); } while(d.getDay()===0||d.getDay()===6);
  return d.toISOString().slice(0,10);
}

/* Everything making the board disagree with the work. Each line is something this
   page can clear, so the bar is never just a complaint. */
function staleness(){
  const S=stats(), out=[];
  const synced=MARK?String(MARK.at).slice(0,10):null;
  const moved=MARK?ALL.filter(t=>t.updated_at&&t.updated_at>MARK.at).length:ALL.length;
  if(!synced || synced<lastWorkday() || moved)
    out.push({mark:true,
      t:'The sprint tracker needs updating',
      s:synced?`Last marked updated ${D(synced)}.${moved?` ${moved} item${moved>1?'s have':' has'} changed since.`:''}`
              :'It has not been marked updated yet.'});
  if(S.overdue.length) out.push({n:S.overdue.length, go:'queue',
    t:`${S.overdue.length} item${S.overdue.length>1?'s are':' is'} past the date on the board`,
    s:'Mark it done with how you checked it, or send a new date with the reason. Either one clears it.'});
  if(S.waiting.length) out.push({n:S.waiting.length, go:'dates',
    t:`${S.waiting.length} date${S.waiting.length>1?'s are':' is'} waiting on you`,
    s:'Confirm it, or send back the date you can actually hit.'});
  const last=EOD.length?EOD[0].report_date:null, due=lastWorkday();
  if(!last||last<due) out.push({
    t:last?`No end of day report since ${D(last)}`:'No end of day report on file',
    s:`The last one due was ${D(due)}. Send it the way you always have and this clears on the next refresh.`});
  const quiet=open_().filter(t=>t.updated_at&&days(String(t.updated_at).slice(0,10))<=-10);
  if(quiet.length) out.push({n:quiet.length, go:'queue',
    t:`${quiet.length} item${quiet.length>1?'s have':' has'} not moved in ten days`,
    s:'If one is finished, close it. If it is parked on purpose, send a date and say so, and it stops counting.'});
  const un=unreadAns();
  if(un.length) out.push({n:un.length, go:'answers',
    t:`${un.length} answer${un.length>1?'s are':' is'} unread`,
    s:'Press Got it so Ignacio can see it landed and stops chasing it.'});
  return out;
}

/* An answer nobody has scheduled and nobody has cleared is the quiet failure this
   page exists to prevent. Got it clears it. Proposing a date clears it. */
function needsDate(){
  return unreadAns().filter(d=>d.status==='answered' && !ALL.some(t=>t.origin===d.ref));
}

/* Where the open queue sits against the calendar. Four states, not four series. */
function queueSplit(){
  const rows=open_();
  const seg=(label,color,f)=>({label,color,rows:rows.filter(f)});
  return [
    seg('Past their date','#f0616d',   t=>{const d=agreed(t);return d&&days(d)<0;}),
    seg('Due within a week','#e0a132', t=>{const d=agreed(t);return d&&days(d)>=0&&days(d)<=6;}),
    seg('Dated, further out','#7896eb',t=>{const d=agreed(t);return d&&days(d)>6;}),
    seg('No date yet','#64748b',       t=>!agreed(t))
  ].filter(x=>x.rows.length);
}

/* Shipped per week, eight weeks back. One series, one colour, no legend needed. */
function shippedWeeks(){
  const mon=d=>{const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x;};
  const start=mon(today()), out=[];
  for(let i=7;i>=0;i--){
    const a=new Date(start); a.setDate(a.getDate()-i*7);
    const b=new Date(a); b.setDate(b.getDate()+7);
    const ai=a.toISOString().slice(0,10), bi=b.toISOString().slice(0,10);
    out.push({label:short(ai),
      n:ALL.filter(t=>t.status==='shipped'&&t.shipped_on&&t.shipped_on>=ai&&t.shipped_on<bi).length});
  }
  return out;
}

function chartQueue(){
  const segs=queueSplit(), total=segs.reduce((a,x)=>a+x.rows.length,0);
  if(!total) return '<div class="p muted">Nothing open. The queue is empty.</div>';
  return `<div class="ch-s">Every open item, grouped by where its agreed date sits against today. The counts are in the key, so nothing here depends on telling the colours apart.</div>
  <div class="stack">${segs.map(x=>
    `<div class="sg" style="width:${(x.rows.length/total*100).toFixed(2)}%;background:${x.color}" title="${esc(x.label)}: ${x.rows.length}"></div>`).join('')}</div>
  <div class="leg">${segs.map(x=>
    `<span class="lg"><i class="sw" style="background:${x.color}"></i>${esc(x.label)} <b class="lv">${x.rows.length}</b></span>`).join('')}</div>`;
}

function chartShipped(){
  const w=shippedWeeks(), max=Math.max(1,...w.map(x=>x.n)), total=w.reduce((a,x)=>a+x.n,0);
  return `<div class="ch-s">Items marked done, by the week they were marked. ${total} in the last eight weeks. This week is still filling.</div>
  <div class="cols2">${w.map((x,i)=>`<div class="c2${i===w.length-1?' on':''}" title="Week of ${esc(x.label)}: ${x.n}">
    <div class="c2-v">${x.n||''}</div>
    <div class="c2-b" style="height:${Math.max(2,Math.round(x.n/max*92))}px"></div>
    <div class="c2-l">${esc(x.label)}</div></div>`).join('')}</div>`;
}

function staleBar(){
  const L=staleness();
  if(!L.length) return '';
  return `<div class="stale">
  <div class="stale-h"><span class="stale-d"></span>
    <div class="stale-t">Needs updating</div>
    <button class="btn stale-r" id="rf3">Refresh</button></div>
  <div class="stale-l">${L.map(x=>`<div class="stale-i">
    <span class="stale-n">${x.n?x.n:'!'}</span>
    <div class="stale-x"><b>${x.t}</b><span>${x.s}</span></div>
    ${x.mark?`<button class="btn stale-g" data-synced="1">I have updated it</button>`:''}
    ${x.go?`<button class="btn stale-g" data-go="${x.go}">Open</button>`:''}
  </div>`).join('')}</div>
</div>`;
}

function bar(pct,tone){ return `<div class="bar"><span class="${tone}" style="width:${Math.max(2,Math.min(100,pct))}%"></span></div>`; }

/* Each nav item is its own view. Shared stats are computed once per draw. */
function stats(){
  const rows=ordered(open_());
  return {
    rows,
    waiting: rows.filter(t=>t.date_state==='pending'),
    rest:    rows.filter(t=>t.date_state!=='pending'||t.rank!=null),
    overdue: rows.filter(t=>{const d=agreed(t);return d&&days(d)<0;}),
    dueSoon: rows.filter(t=>{const d=agreed(t);return d&&days(d)>=0&&days(d)<=1;}),
    proposed: ALL.filter(t=>t.proposed_on),
    sprint:   ALL.filter(t=>t.sprint==='S8'),
    answers:  decided(),
    unread:   unreadAns()
  };
}

/* Renders the brief the way the document reads: section headings, sub-headings,
   bullets, tables, and bold. Escapes first, so document text can never inject. */
function md(src){
  if(!src) return '';
  const lines=String(src).split(/\r?\n/);
  const inline=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\b(https?:\/\/[^\s<]+)/g,'<span class="mono">$1</span>');
  let out='',list=[],tbl=[];
  const flushList=()=>{ if(list.length){ out+='<ul class="bl">'+list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; list=[]; } };
  const flushTbl=()=>{
    if(!tbl.length) return;
    const cells=r=>r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
    const rows=tbl.filter(r=>!/^\|(?:\s*:?-+:?\s*\|)+$/.test(r));
    const head=cells(rows[0]), body=rows.slice(1).map(cells);
    // a two-column table with a blank header is a From/To/Platform block, not a grid
    const defn = head.length===2 && head.every(h=>!h);
    if(defn){
      out+='<dl class="meta">'+body.map(([k,v])=>
        `<dt>${inline(k)}</dt><dd>${inline(v||'')}</dd>`).join('')+'</dl>';
    }else{
      out+='<div class="tblwrap"><table class="btbl"><thead><tr>'+
        head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'+
        body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+
        '</tbody></table></div>';
    }
    tbl=[];
  };
  for(const raw of lines){
    const l=raw.trim();
    if(/^\|.*\|$/.test(l)){ flushList(); tbl.push(l); continue; }
    flushTbl();
    if(/^[-*]\s+/.test(l)){ list.push(inline(l.replace(/^[-*]\s+/,''))); continue; }
    flushList();
    if(!l) continue;
    if(/^###\s+/.test(l))      out+=`<div class="bh3">${inline(l.replace(/^###\s+/,''))}</div>`;
    else if(/^##\s+/.test(l))  out+=`<div class="bh2">${inline(l.replace(/^##\s+/,''))}</div>`;
    else if(/^#\s+/.test(l))   out+=`<div class="bh1">${inline(l.replace(/^#\s+/,''))}</div>`;
    else out+=`<p class="bp">${inline(l)}</p>`;
  }
  flushList(); flushTbl();
  return out;
}

    return `<button class="nav-i${k===cur?' on':''}" data-k="${k}">
      <span class="ni">${V[k].icon}</span><span class="lbl">${V[k].label}</span>
      ${n?`<span class="nav-n">${n}</span>`:''}</button>`;}).join('');
}
function shut(){ document.getElementById('side').classList.remove('open');
                 document.getElementById('scrim').classList.remove('on'); }
function go(k){ cur=k; draw(); shut(); window.scrollTo(0,0); }

const views=document.getElementById('views'), toast=document.getElementById('toast');
const refreshBtn=document.getElementById('refresh');
function say(m){ toast.textContent=m; toast.classList.add('on'); setTimeout(()=>toast.classList.remove('on'),2800); }
function draw(){
  const sb=document.getElementById('stale'); if(sb) sb.innerHTML=staleBar();
  views.innerHTML=`<div class="view on">${V[cur].h()}</div>`;
  document.getElementById('ttl').textContent=V[cur].label;
  document.getElementById('sub').textContent=cur==='brief'?'Dev queue':V[cur].label;
  if(biAuto){ const r=biAuto; biAuto=null;
    const b=document.getElementById('bi-'+r);
    if(b){ b.hidden=false; b.scrollIntoView({block:'center'});
      const i=b.querySelector('input'); if(i) i.focus(); } }
  drawNav();
}
async function refresh(quiet){
  try{ await load(); draw(); if(!quiet) say('Refreshed.'); }catch(e){ say(e.message); }
}
async function act(fn){ try{ await fn(); await refresh(true); }catch(e){ say(e.message); } }
const val=id=>{const n=document.getElementById(id);return n?n.value.trim():'';};

/* the whole control opens the picker, not just the native icon */
document.addEventListener('click',e=>{
  const w=e.target.closest('.dtwrap'); if(!w) return;
  const f=w.querySelector('input[type=date]');
  if(f&&f.showPicker){ try{ f.showPicker(); }catch(_){} }
});
document.getElementById('burger').onclick=()=>{document.getElementById('side').classList.add('open');
  document.getElementById('scrim').classList.add('on');};
document.getElementById('scrim').onclick=shut;

document.addEventListener('click',e=>{
  if(e.target===refreshBtn||e.target.id==='rf2'||e.target.id==='rf3') return refresh();

  if(e.target.closest('[data-synced]')){ const who=val('who');
    return act(async()=>{ await rpc('mark_tracker_synced',{p_who:who||null});
      say('Sprint tracker marked up to date.'); }); }
  const nv=e.target.closest('[data-k]'); if(nv) return go(nv.dataset.k);
  const gt=e.target.closest('[data-go]'); if(gt) return go(gt.dataset.go);
  if(e.target.closest('[data-brief]')){ briefOpen=!briefOpen; return draw(); }

  if(e.target.closest('[data-ansmore]')){ ansOldOpen=!ansOldOpen; return draw(); }

  const ak=e.target.closest('[data-ack]');
  if(ak){ const r=ak.dataset.ack, who=val('who'); if(who) localStorage.setItem(WHO,who);
    return act(async()=>{ await rpc('ack_decision',{p_ref:r,p_who:who||null});
      say(`${r} marked read. Ignacio sees that on his board.`); }); }

  const fo=e.target.closest('[data-fuopen]');
  if(fo){ const b=document.getElementById('fu-'+fo.dataset.fuopen);
    if(b){ b.hidden=!b.hidden; if(!b.hidden){ const t=b.querySelector('textarea'); if(t) t.focus(); } }
    return; }

  const ga=e.target.closest('[data-goans]');
  if(ga){ biAuto=ga.dataset.goans; return go('answers'); }

  const bo=e.target.closest('[data-biopen]');
  if(bo){ const b=document.getElementById('bi-'+bo.dataset.biopen);
    if(b){ b.hidden=!b.hidden; if(!b.hidden){ const i=b.querySelector('input'); if(i) i.focus(); } }
    return; }

  const bq=e.target.closest('[data-bid]');
  if(bq){ const f=document.getElementById('bd-'+bq.dataset.bid);
    if(f){ f.value=bq.dataset.d;
      bq.parentElement.querySelectorAll('.qd').forEach(x=>x.classList.remove('on'));
      bq.classList.add('on'); } return; }

  const bs=e.target.closest('[data-bisend]');
  if(bs){ const r=bs.dataset.bisend, who=val('who'); if(who) localStorage.setItem(WHO,who);
    if(!val('bt-'+r)) return say('Say in one line what gets built.');
    if(!val('bd-'+r)) return say('Pick the date you can hit.');
    return act(async()=>{ const o=await rpc('propose_from_decision',{p_ref:r,p_what:val('bt-'+r),
      p_date:val('bd-'+r),p_who:who||null,p_why:val('bw-'+r)||null});
      say(`On the tracker as #${o&&o.number?o.number:''} for ${short(val('bd-'+r))}. Ignacio sees it as a date sent to him.`); }); }

  const fs=e.target.closest('[data-fusend]');
  if(fs){ const r=fs.dataset.fusend, who=val('who'); if(who) localStorage.setItem(WHO,who);
    if(!val('ft-'+r)) return say('Say what is not clear, so he can answer it in one pass.');
    return act(async()=>{ const o=await rpc('follow_up_decision',{p_ref:r,p_question:val('ft-'+r),p_who:who||null});
      say(`Sent back as ${o&&o.ref?o.ref:'a new question'}. It is on his board now.`); }); }

  const dn=e.target.closest('[data-done]');
  if(dn){ const n=Number(dn.dataset.done), who=val('who');
    if(!val('dn-'+n)) return say('Say how you checked it is live.');
    return act(async()=>{ await rpc('mark_done',{p_number:n,p_evidence:val('dn-'+n),p_who:who||'Dev team'});
      say(`#${n} marked done. It leaves the queue.`); }); }

  const qo=e.target.closest('[data-qopen]');
  if(qo){ const r=document.getElementById('qr-'+qo.dataset.qopen);
    if(r){ r.hidden=!r.hidden; if(!r.hidden) r.querySelector('input').focus(); } return; }
  const qs=e.target.closest('[data-qsend]');
  if(qs){ const n=Number(qs.dataset.qsend), who=val('who'); if(who) localStorage.setItem(WHO,who);
    return act(async()=>{ await rpc('ask_answer',{p_number:n,p_question:val('qt-'+n),p_who:who||null});
      say(`Sent to Ignacio. #${n} shows as waiting until he answers.`); }); }

  const qd=e.target.closest('[data-qd]');
  if(qd){ const f=document.getElementById('nd-'+qd.dataset.qd);
    if(f){ f.value=qd.dataset.d;
      qd.parentElement.querySelectorAll('.qd').forEach(x=>x.classList.remove('on'));
      qd.classList.add('on'); } return; }

  const ok=e.target.closest('[data-ok]');
  if(ok){ const n=Number(ok.dataset.ok), who=val('who'); if(who) localStorage.setItem(WHO,who);
    return act(async()=>{ await rpc('answer_date',{p_number:n,p_action:'confirm',p_who:who||null});
      say(`#${n} confirmed. Ignacio sees it on his board.`); }); }

  const no=e.target.closest('[data-no]');
  if(no){ const n=Number(no.dataset.no), who=val('who'); if(who) localStorage.setItem(WHO,who);
    if(!val('nd-'+n)) return say('Pick the new date you can hit.');
    return act(async()=>{ await rpc('answer_date',{p_number:n,p_action:'counter',
      p_new_date:val('nd-'+n),p_reason:val('wy-'+n)||null,p_who:who||null});
      say(`#${n} moved to ${short(val('nd-'+n))}. Reason sent with it.`); }); }
});

(async()=>{
  views.innerHTML='<div class="view on"><div class="p muted">Loading the queue...</div></div>';
  try{ await load(); refreshBtn.hidden=false; draw(); }
  catch(e){ views.innerHTML=`<div class="view on"><div class="card"><div class="card-t">Could not load</div>
    <div class="p" style="margin-top:8px">${esc(e.message)}</div>
    <div class="row" style="margin-top:12px"><button class="btn" onclick="location.reload()">Try again</button></div></div></div>`; }
})();

/* Speech to text on every text field.
   One button lives at the document level and moves to whichever field has focus.
   Nothing about any form changes, and browsers without the API never see it. */
(function(){
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR) return;
  function ok(el){
    if(!el) return false;
    if(el.tagName === 'TEXTAREA') return true;
    if(el.tagName !== 'INPUT') return false;
    var t = (el.getAttribute('type') || 'text').toLowerCase();
    return t === 'text' || t === 'search';
  }
  var b = document.createElement('button');
  b.type = 'button'; b.className = 'micb';
  b.setAttribute('aria-label', 'Speak instead of typing');
  b.title = 'Speak instead of typing';
  b.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">' +
    '<path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/>' +
    '<path fill="currentColor" d="M18 12a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.92V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.08A6 6 0 0 0 18 12z"/>' +
    '</svg>';
  var hint = document.createElement('div');
  hint.className = 'michint'; hint.textContent = 'Listening';
  document.body.appendChild(b); document.body.appendChild(hint);

  var field = null, rec = null, live = false, base = '', at = 0;

  function place(){
    if(!field || !document.body.contains(field)){ hide(); return; }
    var r = field.getBoundingClientRect();
    if(r.width < 90 || r.bottom < 4 || r.top > innerHeight - 4){ hide(); return; }
    var top = field.tagName === 'TEXTAREA' ? r.top + 8 : r.top + (r.height - 26) / 2;
    b.style.left = (r.right - 33) + 'px'; b.style.top = top + 'px';
    b.classList.add('on2');
    hint.style.left = (r.right - 33) + 'px'; hint.style.top = (top - 24) + 'px';
    if(live) hint.classList.add('on2'); else hint.classList.remove('on2');
  }
  function hide(){ b.classList.remove('on2'); hint.classList.remove('on2'); }

  addEventListener('focusin', function(e){ if(ok(e.target)){ field = e.target; place(); } });
  addEventListener('focusout', function(e){
    if(e.target !== field) return;
    setTimeout(function(){
      if(document.activeElement !== field && !live){ hide(); field = null; }
    }, 150);
  });
  addEventListener('scroll', place, true);
  addEventListener('resize', place);

  b.addEventListener('mousedown', function(e){ e.preventDefault(); });
  b.addEventListener('click', function(){
    if(live){ try{ rec.stop(); }catch(_){} return; }
    if(!field) return;
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = true; rec.continuous = true;
    base = field.value;
    at = (typeof field.selectionStart === 'number') ? field.selectionStart : field.value.length;
    rec.onstart = function(){ live = true; b.classList.add('rec'); place(); };
    rec.onerror = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2'); };
    rec.onend   = function(){ live = false; b.classList.remove('rec'); hint.classList.remove('on2');
                              if(field) try{ field.focus(); }catch(_){} };
    rec.onresult = function(ev){
      var txt = '';
      for(var i = 0; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
      txt = txt.replace(/\s+/g, ' ').trim();
      if(!txt) return;
      var pre = base.slice(0, at), post = base.slice(at);
      var sep = (pre && !/\s$/.test(pre)) ? ' ' : '';
      field.value = pre + sep + txt + post;
      try{ field.setSelectionRange(field.value.length - post.length, field.value.length - post.length); }catch(_){}
      field.dispatchEvent(new Event('input', {bubbles:true}));
      place();
    };
    try{ rec.start(); }catch(_){}
  });
})();
</script>
